<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>SOP Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
/* VOICE work tool in P2A's own look (Evo nav, cyan pills, uppercase card titles)
   IDEA the SOP is a tree drawn across four coloured bands: Find, Review, Act, Finish
   PICTURE the tree itself, editable in place; ghost boxes are where the next thing goes
   COLOUR P2A tokens: nav #0D131A, cyan #5BC2E7 (act here), link #0A6490; bands = topic cyan, review purple, act amber, finish green
   TYPE Inter, uppercase letter-spaced section titles like P2A
   LAYOUT header bar + SOP strip, canvas (scrolls/zooms) + docked edit panel on wide screens, drawer on smaller */
:root{--nav:#0D131A;--cyan:#5BC2E7;--on-accent:#0D131A;--link:#0A6490;--title:#1A202C;--ink:#1D2633;--mut:#4A5568;--ph:#6B7785;--bg:#F7F9FB;--card:#FFFFFF;--line:#D5DCE4;--input-bg:#FFFFFF;--input-bd:#9AA6B5;--accbg:#E8F6FC;--ok:#1F7A4A;--okbg:#E6F4EC;--warn:#8A5A00;--warnbg:#FDF1D8;--warnl:#E9C46A;--bad:#C53030;--rev:#5B4BB7;--revbg:#EFECFA;--canvas:#F1F3F5;--dot:#C9D1DA;
 --b-find:#E6F4FA;--b-findl:#0A6490;--b-rev:#F1EEFA;--b-revl:#5B4BB7;--b-act:#FFF6E3;--b-actl:#B07A00;--b-fin:#E9F5EE;--b-finl:#1F7A4A;--sh:0 1px 3px rgba(13,19,26,.08);color-scheme:light}
:root[data-theme="dark"]{--link:#5BC2E7;--title:#E6EDF3;--ink:#B8C4D0;--mut:#8A99AA;--ph:#7D8B9B;--bg:#131B24;--card:#1A242F;--line:#2A3644;--input-bg:#0F161D;--input-bd:#4A5868;--accbg:rgba(91,194,231,.14);--ok:#59c98b;--okbg:#1c3a2b;--warn:#e8b855;--warnbg:#3a2f14;--warnl:#6B5520;--bad:#ff8a80;--rev:#b3a8ff;--revbg:#2a2547;--canvas:#16202A;--dot:#2C3A48;
 --b-find:#14293A;--b-findl:#5BC2E7;--b-rev:#211E38;--b-revl:#b3a8ff;--b-act:#2E2612;--b-actl:#e8b855;--b-fin:#15291F;--b-finl:#59c98b;--sh:0 1px 3px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--link:#5BC2E7;--title:#E6EDF3;--ink:#B8C4D0;--mut:#8A99AA;--ph:#7D8B9B;--bg:#131B24;--card:#1A242F;--line:#2A3644;--input-bg:#0F161D;--input-bd:#4A5868;--accbg:rgba(91,194,231,.14);--ok:#59c98b;--okbg:#1c3a2b;--warn:#e8b855;--warnbg:#3a2f14;--warnl:#6B5520;--bad:#ff8a80;--rev:#b3a8ff;--revbg:#2a2547;--canvas:#16202A;--dot:#2C3A48;--b-find:#14293A;--b-findl:#5BC2E7;--b-rev:#211E38;--b-revl:#b3a8ff;--b-act:#2E2612;--b-actl:#e8b855;--b-fin:#15291F;--b-finl:#59c98b;--sh:0 1px 3px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
::placeholder{color:var(--ph);opacity:1}
/* header like P2A */
header{background:var(--nav);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:31}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.06em;font-size:16px;white-space:nowrap}
.logo i{width:11px;height:11px;background:var(--cyan);transform:rotate(45deg);border-radius:2px;display:inline-block}
.seg{display:inline-flex;background:#1C2530;border:1px solid #2F3B48;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#AEBBCA;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--cyan);color:var(--on-accent)}
.sp{flex:1}
.hbtn{border:1.4px solid #3A4755;background:transparent;color:#fff;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--cyan)}
.hbtn.pri{background:var(--cyan);border-color:var(--cyan);color:var(--on-accent)}
.hbtn.todo{border-color:#8A6A1E;color:#F2C66D}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:1.5px solid var(--cyan);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.3);min-width:220px;padding:6px;z-index:40}
.menu .dd button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:14px}
.menu .dd button:hover{background:var(--accbg)}
.menu .dd hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* SOP strip */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:12px;align-items:end;padding-block:14px 10px}
.strip>*{min-width:0}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--title);margin:0 0 5px}
.lbl small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--mut);margin-left:6px}
.in,textarea.in,select.in{width:100%;background:var(--input-bg);border:1px solid var(--input-bd);border-radius:8px;padding:8px 11px;min-width:0;color:var(--title)}
textarea.in{resize:vertical;min-height:40px;line-height:1.4}
.in:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:var(--cyan)}
.ttl{font-size:18px;font-weight:700}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--cyan);color:var(--on-accent);border:1.4px solid var(--cyan);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.sec{background:transparent;color:var(--link);border-color:var(--link)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sure{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,.hbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.zoom button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--link);font-weight:700}
.zoom span{padding:6px 4px;font-size:12px;color:var(--mut);min-width:44px;text-align:center}
.banner{border:1.5px dashed var(--cyan);background:var(--accbg);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--title);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.banner button{margin-left:auto}
/* work area */
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start;padding-bottom:40px}
.work>*{min-width:0}
.cv{background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:20px 20px;background-attachment:local;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 190px);min-height:420px;position:relative;display:flex}
.cvs{position:relative;flex:none;margin:auto}
.cvi{position:absolute;left:0;top:0;transform-origin:0 0}
.band{position:absolute;border:1.5px solid;border-radius:16px}
.band .bh{position:absolute;display:flex;align-items:center;gap:8px}
.band .bt{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.band .bs{font-size:12px;color:var(--mut)}
.qbtn{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;background:var(--card);font-weight:800;font-size:12px;cursor:pointer;display:inline-grid;place-items:center;padding:0;line-height:1}
.band.find{background:color-mix(in srgb,var(--b-find) 55%,transparent);border-color:color-mix(in srgb,var(--b-findl) 35%,transparent);color:var(--b-findl)}
.band.rev{background:color-mix(in srgb,var(--b-rev) 55%,transparent);border-color:color-mix(in srgb,var(--b-revl) 35%,transparent);color:var(--b-revl)}
.band.act{background:color-mix(in srgb,var(--b-act) 55%,transparent);border-color:color-mix(in srgb,var(--b-actl) 35%,transparent);color:var(--b-actl)}
.band.fin{background:color-mix(in srgb,var(--b-fin) 55%,transparent);border-color:color-mix(in srgb,var(--b-finl) 35%,transparent);color:var(--b-finl)}
.band::before{content:"";position:absolute;background:currentColor;border-radius:6px}
.down .band::before{left:-1.5px;top:-1.5px;bottom:-1.5px;width:5px}
.side .band::before{left:-1.5px;right:-1.5px;top:-1.5px;height:5px}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.bx{position:absolute;background:var(--card);border:1.6px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:var(--sh);cursor:pointer;overflow:hidden;color:var(--title)}
.bx:hover{border-color:var(--link)}
.bx.on{outline:3px solid var(--cyan);outline-offset:2px}
.bx .k{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.bx .t{font-weight:650;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bx .d{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx.st{border-color:var(--title)}
.bx.qu{border-color:var(--b-findl)}
.bx.qu .t{color:var(--link)}
.bx.qu .t::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--link);color:var(--card);font-size:11px;font-weight:800;margin-right:6px;vertical-align:1px}
.bx.gr{border:1.8px dashed var(--b-revl);background:var(--card);cursor:default}
.gr .gh{font-weight:700;color:var(--rev);font-size:13px;margin-bottom:6px;cursor:pointer}
.gr .gh small{font-weight:500;color:var(--mut)}
.gr .row{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--revbg);border-radius:7px;padding:5px 8px;margin-bottom:5px;cursor:pointer;min-height:30px}
.gr .row:hover{border-color:var(--rev)}
.gr .row.on{outline:2px solid var(--cyan)}
.gr .row .n{font-weight:650;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;max-width:48%}
.gr .row .ps{display:flex;gap:3px;overflow:hidden;flex:1;justify-content:flex-end}
.gr .row.fu{margin-left:16px;border-left:3px solid var(--warnl)}
.gr .row .if{font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap}
.mini{font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--warnbg);color:var(--warn);white-space:nowrap;border:1px solid var(--warnl)}
.mini.dot::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#D99A00;margin-left:4px;vertical-align:1px}
.gr .add{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:7px;padding:5px 8px;font-size:12.5px;min-height:30px;resize:none}
.bx.act{border-color:var(--b-actl)}
.bx.act .k{color:var(--warn)}
.bx.fin.ok{background:var(--okbg);border-color:var(--ok)}
.bx.fin.am{background:var(--warnbg);border-color:var(--warnl)}
.bx.fin .t{font-size:12.5px;font-weight:800}
.bx.fin .d{color:var(--ink)}
.bx.gh{border:1.6px dashed var(--input-bd);background:transparent;box-shadow:none;cursor:default;padding:7px 8px}
.bx.gh .k{color:var(--link);margin:0 0 5px 2px}
.gbtns{display:flex;flex-wrap:wrap;gap:4px}
.qbar{position:absolute;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:5px;flex-wrap:nowrap;white-space:nowrap;background:var(--card);border:1.5px solid var(--cyan);border-radius:999px;padding:5px 6px 5px 12px;box-shadow:0 6px 18px rgba(13,19,26,.22)}
.qbar span{font-size:12px;font-weight:700;color:var(--title);margin-right:2px}
.qbar button{border:1px solid var(--link);background:var(--card);color:var(--link);border-radius:999px;font-size:12.5px;font-weight:600;padding:4px 11px;min-height:28px;cursor:pointer}
.qbar button:hover{background:var(--accbg)}
.gbtns button{border:1px solid var(--link);background:var(--card);color:var(--link);border-radius:999px;font-size:11.5px;font-weight:600;padding:2px 8px;cursor:pointer}
.gbtns button:hover{background:var(--accbg)}
.bx.gt{border:1.6px dashed var(--link);background:var(--accbg);font-size:12.5px;font-weight:600;color:var(--link);display:flex;align-items:center}
.elab{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:1.4px solid var(--input-bd);border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 9px;white-space:nowrap;cursor:pointer;color:var(--title);max-width:180px;overflow:hidden;text-overflow:ellipsis;z-index:2}
.elab.ok{border-color:var(--ok);color:var(--ok)}.elab.am{border-color:var(--b-actl);color:var(--warn)}
.elab.on{outline:2px solid var(--cyan)}
/* panel = P2A card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--sh)}
.panel{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
.ph{position:sticky;top:-14px;background:var(--card);margin:-14px -16px 6px;padding:13px 16px 8px;display:flex;align-items:center;gap:8px;z-index:2;border-bottom:1px solid var(--line)}
.ph .lbl{margin:0}
.ph .x{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--mut);padding:0 4px}
.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.sec{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--title);margin-top:16px}
details.it{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--bg)}
details.it.am{border-color:var(--warnl);background:var(--warnbg)}
details.it>summary{cursor:pointer;font-weight:650;list-style:none;display:flex;gap:6px;align-items:center;color:var(--title)}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary::before{content:"▸";color:var(--mut)}
details.it[open]>summary::before{content:"▾"}
details.it .in{background:var(--input-bg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.muted{color:var(--mut);font-size:12.5px}
.helpul{margin:6px 0 0;padding-left:18px;color:var(--ink);font-size:13px}.helpul li{margin-bottom:4px}
.todos{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.todos button{text-align:left;border:1px solid var(--warnl);background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:12.5px}
.good{background:var(--okbg);color:var(--ok);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.cb{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;margin-top:4px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--mut);font-weight:600}
.seg2 button[aria-pressed="true"]{background:var(--cyan);color:var(--on-accent)}
/* details page */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;padding-bottom:40px}.two>*{min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2>*{min-width:0}
.watch{list-style:none;padding:0;margin:8px 0 0}.watch li{display:flex;gap:6px;margin-bottom:6px}
/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(7,11,15,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(5vh,16px) 16px 16px;overflow:auto}
.dlg{background:var(--card);color:var(--ink);border:2px solid var(--cyan);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(720px,100%);padding:18px 20px}
.dlg.wide{width:min(1080px,100%)}
.dlg h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--title);display:flex;align-items:center;gap:8px;margin:0 0 8px}
.dlg h2 .btn{margin-left:auto}
.dlg h3{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 6px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:50vh;overflow:auto}
.li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.li:hover{border-color:var(--link)}.li.on{border-color:var(--cyan);background:var(--accbg)}
.li .t{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;color:var(--title)}.li .s{font-size:12px;color:var(--mut);white-space:nowrap}
pre.out{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:36vh;overflow:auto;margin:6px 0;color:var(--title)}
.tryg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}.tryg>*{min-width:0}
.trow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;border-left:4px solid var(--line)}
.trow.find{border-left-color:var(--b-findl)}.trow.rev{border-left-color:var(--b-revl)}
.trow .t{font-weight:650;font-size:13.5px;color:var(--title)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--card);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--cyan);border-color:var(--cyan);color:var(--on-accent);font-weight:600}
.chip.pass.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.prob.on{background:var(--warnbg);border-color:var(--warnl);color:var(--warn)}
.res{border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1.5px solid}
.res.act{background:var(--b-act);border-color:var(--b-actl)}
.res.fin{background:var(--b-fin);border-color:var(--b-finl)}
.res .lbl{margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.how ol{margin:6px 0 0 18px;padding:0}.how li{margin-bottom:6px}
@media (max-width:1380px){.work{grid-template-columns:minmax(0,1fr)}.panel{position:fixed;top:auto;right:16px;bottom:16px;width:min(400px,calc(100% - 32px));max-height:min(80vh,780px);z-index:45;box-shadow:0 18px 50px rgba(0,0,0,.35);border:2px solid var(--cyan)}.panel.idle{display:none}}
@media (max-width:900px){.strip{grid-template-columns:minmax(0,1fr)}.cv{max-height:none}}
@media (max-width:640px){.two,.row2,.tryg{grid-template-columns:minmax(0,1fr)}.panel{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px))}.logo span{display:none}.hd{gap:6px}.hbtn{padding:5px 10px}}
</style>

<header><div class="hd">
 <div class="logo"><i></i>EVO <span>SOP BUILDER</span></div>
 <div class="seg" role="group" aria-label="View"><button data-tab="map" aria-pressed="true">Diagram</button><button data-tab="details" aria-pressed="false">Details</button></div>
 <div class="sp"></div>
 <button class="hbtn todo" id="bTodo" hidden></button>
 <button class="hbtn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
 <button class="hbtn pri" id="bTry">Try a case</button>
 <div class="menu"><button class="hbtn" id="bMenu" aria-haspopup="true" aria-expanded="false">☰ Menu</button><div class="dd" id="dd" hidden>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const VERSION='4.2',KEY='evosb42:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};

/* ---------- model: a tree ----------
 step     {type:'step',name,detail,next}
 question {type:'question',question,detail,answers:[{label,words,next}]}      pick one, no wrong answer
 group    {type:'group',name,checks:[check],pass,fail}                        Review: any order
   check  {name,detail,problems:[prob]}  prob {label,words,donow,template,text,copilot,ticket,follow:[check]}
 end      {type:'end',tone:'ok'|'am',action,template,text,copilot,ticket,combine}  Act + Finish
 goto     {type:'goto',target}                                                continues at another box */
const M={
 step:o=>({id:uid(),type:'step',name:'',detail:'',next:null,...o}),
 question:o=>({id:uid(),type:'question',question:'',detail:'',answers:[A('Yes'),A('No')],...o}),
 group:o=>({id:uid(),type:'group',name:'Checks',checks:[],pass:M.end({tone:'ok'}),fail:M.end({tone:'am',combine:true,action:'Leave the account as it is'}),...o}),
 end:o=>({id:uid(),type:'end',tone:'ok',action:'',template:'',text:'',copilot:'',ticket:'',combine:false,...o}),
 goto:o=>({id:uid(),type:'goto',target:'',...o})};
function A(label,o){return{id:uid(),label,words:'',next:null,...o}}
const C=o=>({id:uid(),name:'',detail:'',problems:[],...o});
const P=o=>({id:uid(),label:'',words:'',donow:'',template:'',text:'',copilot:'',ticket:'',follow:[],...o});
const base=()=>({id:uid(),title:'New SOP',when:'',applies:'',tags:'',topic:'',confluence:'',status:'Draft',links:[],watch:[],meta:{name:'',role:'',notes:''},dir:'down',root:null,updated:Date.now()});
function blank(){const s=base();s.root=M.step({name:'Find the member in back office',detail:'Search by name, then narrow by email.'});return s}
function example(){const s=base();s.title='Reply to non-BC licence email (example)';s.when='A member replies to our non-BC driver licence email.';s.applies='Accounts flagged for a non-BC licence';s.tags='non-BC licence, student, visitor, updated licence';s.topic='Registration';
 const E=(o)=>M.end(o);
 const grp=M.group({name:'New licence',checks:[C({name:'Clear, front and back',problems:[P({label:'Back missing',template:'DL BACK MISSING',copilot:'Send a photo of the back of the licence',ticket:'-DL back missing, requested'}),P({label:'Blurry',template:'DL PHOTO BLURRY',copilot:'Send a clearer photo of the licence',ticket:'-DL photo blurry, requested new one'})]}),
   C({name:'Not expired',problems:[P({label:'Expired',template:'DL EXPIRED',copilot:'The licence on file is expired; send the renewed one',ticket:'-DL expired, requested renewal',follow:[C({name:'Renewal receipt?',detail:'A paper renewal receipt can count for 90 days.',problems:[P({label:'No receipt',template:'NEED RENEWAL RECEIPT',copilot:'Send the renewal receipt if they have one',ticket:'-No renewal receipt'})]})]})]}),
   C({name:'Name and DOB match the account',problems:[P({label:'Name mismatch',template:'NAME DOES NOT MATCH',copilot:'The name on the licence must match the account',ticket:'-Name on DL does not match account',donow:'Do not unsuspend.'})]})],
  pass:E({tone:'ok',action:'Unsuspend the account',template:'DOCUMENTS VALIDATED, ACCOUNT ACTIVE',text:'Hi XXX,\nThank you for sending your updated driver’s licence. We have validated your documents, and your account is now active again.\nThank you',ticket:'-Updated DL received and validated\n-Account unsuspended'}),
  fail:E({tone:'am',combine:true,action:'Account stays suspended',ticket:'-Account stays suspended until the member sends the items above'})});
 const q3=M.question({question:'Program end date given?',answers:[A('Yes',{next:E({tone:'ok',action:'Note the program end date on the profile',template:'STUDENT BC: END DATE NOTED',ticket:'-Student, program end date noted'})}),A('No',{next:E({tone:'am',action:'Leave as it is',template:'STUDENT: NEED PROGRAM END DATE',copilot:'Ask for the program end date',ticket:'-Student, asked for program end date'})})]});
 const q4=M.question({question:'Study permit with expiry date given?',answers:[A('Yes',{next:E({tone:'ok',action:'Note the permit expiry on the profile',template:'STUDENT: STUDY PERMIT NOTED',ticket:'-Study permit received, expiry noted'})}),A('No',{next:E({tone:'am',action:'Leave as it is',template:'STUDENT: NEED STUDY PERMIT',copilot:'Ask for the study permit and its expiry date',ticket:'-Asked for study permit and expiry'})})]});
 const q2=M.question({question:'Which licence does the student have?',answers:[A('BC',{next:q3}),A('Non-Canadian',{next:q4})]});
 const q1=M.question({question:'What does the member say?',detail:'Read the reply to our email.',answers:[A('Updated licence',{words:'updated, new licence, renewed',next:grp}),A('Visitor',{words:'visiting, tourist, here for',next:E({tone:'ok',action:'Add a profile note: visitor',template:'VISITOR NOTED',ticket:'-Member is a visitor, note added'})}),A('Student',{words:'student, studying, school',next:q2})]});
 s.root=M.step({name:'Find the member in back office',detail:'Search by name, then narrow by email.',next:q1});
 s.watch=['A licence from another province is not a visitor case: check the Non-BC SOP.'];return s}

/* ---------- tree walking ---------- */
// visit every object with a setter that replaces the reference holding it
function walk(s,fn){const node=(n,set,par,slot)=>{if(!n)return;fn(n,n.type,set,par,slot);
  if(n.type==='step')node(n.next,v=>n.next=v,n,'next');
  if(n.type==='question')n.answers.forEach(a=>{fn(a,'answer',null,n,'a');node(a.next,v=>a.next=v,a,'a:'+a.id)});
  if(n.type==='group'){checks(n.checks,n);node(n.pass,v=>n.pass=v,n,'pass');node(n.fail,v=>n.fail=v,n,'fail')}};
 const checks=(L,par)=>L.forEach(c=>{fn(c,'check',null,par,L);c.problems.forEach(p=>{fn(p,'problem',null,c,c.problems);checks(p.follow,p)})});
 node(s.root,v=>s.root=v,null,'root')}
function find(id){let r=null;walk(sop(),(o,kind,set,par,slot)=>{if(!r&&o.id===id)r={o,kind,set,par,slot}});return r}
function holderOf(parId,slot){ // returns setter for a slot on a parent (for ghosts)
 const s=sop();if(parId==='root')return v=>s.root=v;const r=find(parId);if(!r)return null;const o=r.o;
 if(slot==='next')return v=>o.next=v;if(slot==='pass')return v=>o.pass=v;if(slot==='fail')return v=>o.fail=v;if(slot==='a')return v=>o.next=v;return null}
const nameOf=n=>!n?'':n.type==='step'?(n.name||'Step'):n.type==='question'?(n.question||'Question'):n.type==='group'?(n.name||'Checks')+' (checks)':n.type==='end'?(n.action||'End'):'';

/* ---------- state ---------- */
let S=store.get('sops',null);if(!Array.isArray(S)||!S.length)S=[example()];
let cur=store.get('cur',S[0].id);if(!S.find(x=>x.id===cur))cur=S[0].id;
let tab='map',selId=null,selSub=null,zoom=store.get('zoom',1),showHelp=store.get('help',true);
const sop=()=>S.find(x=>x.id===cur);
const undo=[];let lastSnap=JSON.stringify(sop()),saveT=null,drawT=null;
function save(){const s=sop();s.updated=Date.now();const j=JSON.stringify(s);if(j!==lastSnap){undo.push({id:s.id,j:lastSnap});if(undo.length>80)undo.shift();lastSnap=j}clearTimeout(saveT);saveT=setTimeout(()=>{store.set('sops',S);store.set('cur',cur)},250)}
function doUndo(){const u=undo.pop();if(!u){toast('Nothing to undo');return}if(u.restore&&!S.find(x=>x.id===u.id)){S.unshift(JSON.parse(u.j));cur=u.id;lastSnap=u.j;store.set('sops',S);render();toast('SOP restored');return}
 const i=S.findIndex(x=>x.id===u.id);if(i<0)return;S[i]=JSON.parse(u.j);cur=u.id;lastSnap=u.j;if(selId&&!find(selId))selId=null;store.set('sops',S);render();toast('Undone')}

/* ---------- to finish ---------- */
const probTodo=p=>!p.label.trim()?'has no name':!p.template.trim()&&!p.copilot.trim()?'has no template or Copilot point':!p.ticket.trim()?'has no ticket line':'';
function todos(){const s=sop(),T=[];if(!s.when.trim())T.push({id:'when',m:'When to use is empty'});let open=0;
 walk(s,(o,k,set,par)=>{
  if(k==='step'&&!o.name.trim())T.push({id:o.id,m:'A step has no name'});
  if(k==='question'){if(!o.question.trim())T.push({id:o.id,m:'A question has no text'});o.answers.forEach(a=>{if(!a.next)open++})}
  if(k==='step'&&!o.next&&o===s.root)open++;
  if(k==='group'&&!o.checks.length)T.push({id:o.id,m:'"'+o.name+'" has no checks'});
  if(k==='check'&&!o.problems.length)T.push({id:o.id,m:'"'+(o.name||'Check')+'" has no problems'});
  if(k==='problem'){const m=probTodo(o);if(m)T.push({id:par.id,sub:o.id,m:'"'+(o.label||'…')+'" '+m})}
  if(k==='end'){if(!o.action.trim())T.push({id:o.id,m:'An end has no action (Act)'});if(!o.combine&&!o.template.trim())T.push({id:o.id,m:'"'+(o.action||'An end')+'" has no template'});if(!o.ticket.trim())T.push({id:o.id,m:'"'+(o.action||'An end')+'" has no ticket line'})}
  if(k==='goto'&&!find(o.target))T.push({id:o.id,m:'A "continues at" has no target'})});
 return T}

/* ---------- layout ---------- */
const DIM={down:{U:236,find:112,act:92,fin:126,gap:44,head:54,bw:212,bh:70,finh:100,gw:0},side:{U:124,find:262,act:246,fin:282,gap:40,head:62,bw:222,bh:70,finh:100,gw:300}};
function groupRows(g){let n=0;const r=L=>L.forEach(c=>{n++;c.problems.forEach(p=>r(p.follow))});r(g.checks);return n}
const groupH=g=>44+groupRows(g)*35+40;
function layout(s){const dir=s.dir,D=DIM[dir];const items=[];let maxF=0,hasG=false,maxGH=0;
 function mk(n,parent,label,tone,fd,underGroup,slot){let T;
  if(!n){T={kind:'ghost',par:parent,slot,label,tone,fd,underGroup}}
  else T={kind:n.type,o:n,par:parent,label,tone,fd,underGroup};
  T.kids=[];
  if(n&&n.type==='step'){maxF=Math.max(maxF,fd);T.kids.push(mk(n.next,n,'',null,fd+1,false,'next'))}
  else if(n&&n.type==='question'){maxF=Math.max(maxF,fd);n.answers.forEach(a=>{const c=mk(a.next,n,a.label,null,fd+1,false,'a:'+a.id);c.ans=a;T.kids.push(c)})}
  else if(n&&n.type==='group'){hasG=true;maxGH=Math.max(maxGH,groupH(n));T.kids.push(mk(n.pass,n,'All pass','ok',fd,true,'pass'));T.kids.push(mk(n.fail,n,'Any problem','am',fd,true,'fail'))}
  else{if(!underGroup)maxF=Math.max(maxF,fd)} // ghost / goto inside Find
  items.push(T);return T}
 const R=s.root?mk(s.root,null,'',null,0,false,'root'):mk(null,null,'',null,0,false,'root');
 // levels
 const G=maxF+1,AL=maxF+2,FL=maxF+3;
 items.forEach(T=>{T.lv=T.kind==='group'?G:T.kind==='end'?AL:(T.kind==='ghost'||T.kind==='goto')&&T.underGroup?AL:T.fd});
 // level extents along the depth axis
 const size=[];for(let i=0;i<=maxF;i++)size[i]=D.find;size[G]=dir==='down'?(hasG?maxGH+40:60):(hasG?D.gw+50:120);size[AL]=D.act;size[FL]=D.fin;
 const bandOf=i=>i<=maxF?0:i===G?1:i===AL?2:3;const start=[];let p=D.head+16;
 for(let i=0;i<=FL;i++){if(i>0&&bandOf(i)!==bandOf(i-1))p+=D.gap+(dir==='down'?44:0);start[i]=p;p+=size[i]}
 const depthEnd=p+20;
 // breadth units
 const minU=T=>T.kind==='group'?(dir==='down'?2:Math.max(2,Math.ceil((groupH(T.o)+24)/D.U))):1;
 const units=T=>T.w=Math.max(T.kids.reduce((a,k)=>a+units(k),0),minU(T));units(R);
 const place=(T,st)=>{T.c=st+T.w/2;const sum=T.kids.reduce((a,k)=>a+k.w,0);let x=st+(T.w-sum)/2;T.kids.forEach(k=>{place(k,x);x+=k.w})};place(R,0);
 const pad=dir==='down'?56:76;const breadth=R.w*D.U+pad*2;
 const geo=T=>{const d=start[T.lv],b=pad+T.c*D.U;let w,h;
  if(T.kind==='group'){if(dir==='down'){w=T.w*D.U-28;h=groupH(T.o)}else{w=D.gw;h=Math.max(groupH(T.o),T.w*D.U-24)}}
  else if(T.kind==='ghost'){w=D.bw;h=T.underGroup?58:86}else if(T.kind==='goto'){w=D.bw;h=44}else{w=D.bw;h=D.bh}
  if(dir==='down')return{x:b-w/2,y:d+(size[T.lv]-h)/2-(T.kind==='group'?0:0),w,h};return{x:d+(size[T.lv]-w)/2,y:b-h/2,w,h}};
 items.forEach(T=>{T.g=geo(T);if(T.kind==='end'){const f={w:dir==='down'?D.bw:D.bw+20,h:D.finh};const d=start[FL],b=pad+T.c*D.U;T.fg=dir==='down'?{x:b-f.w/2,y:d+(size[FL]-f.h)/2,...f}:{x:d+(size[FL]-f.w)/2,y:b-f.h/2,...f}}});
 const W=dir==='down'?Math.max(breadth,820):depthEnd,H=dir==='down'?depthEnd:Math.max(breadth,420)+D.head;
 const bands=[[0,maxF,'find'],[G,G,'rev'],[AL,AL,'act'],[FL,FL,'fin']].map(([a,z,k])=>({k,a:start[a]-(dir==='down'?44:0)-12,z:start[z]+size[z]+6}));
 return {items,R,W,H,bands,dir,D,pad}}

/* ---------- render the canvas ---------- */
const BANDS={find:['1 · Find','gate and pick-one questions, in order'],rev:['2 · Review','several checks, any order, find every problem'],act:['3 · Act','what the agent does in back office'],fin:['4 · Finish','template, Copilot prompt and ticket']};
function edgePath(a,b,dir){if(dir==='down'){const x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y,m=(y1+y2)/2;return{d:`M${x1} ${y1} C ${x1} ${m}, ${x2} ${m}, ${x2} ${y2}`,lx:x2,ly:y2-16}}
 const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,m=(x1+x2)/2;return{d:`M${x1} ${y1} C ${m} ${y1}, ${m} ${y2}, ${x2} ${y2}`,lx:x2-14,ly:y2-18}}
function canvasHtml(){const s=sop(),Lt=layout(s),dir=Lt.dir;let svg='',html='';
 Lt.bands.forEach(b=>{const [t,sub]=BANDS[b.k];const st=dir==='down'?`left:12px;right:12px;top:${b.a}px;height:${b.z-b.a}px`:`top:12px;bottom:12px;left:${b.a}px;width:${b.z-b.a}px`;
  const hs=dir==='down'?'left:22px;top:10px':'left:14px;top:18px';
  html+=`<div class="band ${b.k}" style="${st}"><div class="bh" style="${hs}"><span class="bt">${t}</span><button class="qbtn" data-help="${b.k}" aria-label="What goes in ${t}">?</button><span class="bs">${sub}</span></div></div>`});
 Lt.items.forEach(T=>{const g=T.g;
  if(T.par!==undefined&&T.par!==null){const pT=Lt.items.find(x=>x.o===T.par);if(pT){const pg=pT.g;const e=edgePath(pg,g,dir);const long=T.lv-pT.lv>2&&T.kind!=='ghost';const col=T.tone==='ok'?'var(--ok)':T.tone==='am'?'var(--b-actl)':'var(--mut)';
    svg+=`<path d="${e.d}" fill="none" stroke="${col}" stroke-width="2" ${long?'stroke-dasharray="3 5"':''} marker-end="url(#ar)"/>`;
    if(T.label){const on=T.ans&&selSub===T.ans.id?' on':'';html+=`<div class="elab ${T.tone||''}${on}" style="left:${e.lx}px;top:${e.ly}px" data-s="${pT.o.id}" ${T.ans?`data-sub="${T.ans.id}"`:''}>${esc(T.label||'…')}</div>`}}}
  const pos=`left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px`,on=o=>o&&selId===o.id&&!selSub?' on':'';
  if(T.kind==='step')html+=`<div class="bx st${on(T.o)}" style="${pos}" data-s="${T.o.id}"><div class="k">Step</div><div class="t">${esc(T.o.name||'Unnamed step')}</div></div>`;
  if(T.kind==='question')html+=`<div class="bx qu${on(T.o)}" style="${pos}" data-s="${T.o.id}"><div class="t">${esc(T.o.question||'New question')}</div>${T.o.detail?`<div class="d">${esc(T.o.detail)}</div>`:''}</div>`;
  if(T.kind==='group'){const rows=[];const r=(L,dep,iff)=>L.forEach(c=>{rows.push(`<div class="row${dep?' fu':''}${selId===T.o.id&&selSub===c.id?' on':''}" data-s="${T.o.id}" data-sub="${c.id}">${iff?`<span class="if">if ${esc(iff)}:</span>`:''}<span class="n">${esc(c.name||'Unnamed check')}</span><span class="ps">${c.problems.map(p=>`<span class="mini${probTodo(p)?' dot':''}">${esc(p.label||'…')}</span>`).join('')||'<span class="muted">no problems yet</span>'}</span></div>`);c.problems.forEach(p=>r(p.follow,dep+1,p.label))});r(T.o.checks,0,'');
   html+=`<div class="bx gr${on(T.o)}" style="${pos}"><div class="gh" data-s="${T.o.id}">${esc(T.o.name||'Checks')} <small>· any order</small></div>${rows.join('')}<textarea class="add" rows="1" data-addck="${T.o.id}" placeholder="+ Type a check, press Enter"></textarea></div>`}
  if(T.kind==='ghost'){const pid=T.par?T.par.id:'root',slot=T.slot.startsWith('a:')?'a':T.slot,ref=T.slot.startsWith('a:')?T.slot.slice(2):pid;const types=T.underGroup?['end','goto']:['step','question','group','end','goto'];
   const nm={step:'Step',question:'Question',group:'Checks',end:'End',goto:'↪ Continue at'};
   html+=`<div class="bx gh" style="${pos}"><div class="k">+ Then…</div><div class="gbtns">${types.map(t=>`<button data-g="${T.slot.startsWith('a:')?ref:pid}|${slot}|${t}">${nm[t]}</button>`).join('')}</div></div>`}
  if(T.kind==='goto'){const tg=find(T.o.target);html+=`<div class="bx gt${on(T.o)}" style="${pos}" data-s="${T.o.id}">↪ Continues at: ${esc(tg?nameOf(tg.o):'pick a box')}</div>`}
  if(T.kind==='end'){const o=T.o,f=T.fg;html+=`<div class="bx act${on(o)}" style="${pos}" data-s="${o.id}"><div class="k">Do</div><div class="t">${esc(o.action||'What the agent does…')}</div></div>`;
   const e=edgePath(g,f,dir);svg+=`<path d="${e.d}" fill="none" stroke="var(--mut)" stroke-width="2" marker-end="url(#ar)"/>`;
   html+=`<div class="bx fin ${o.tone==='am'?'am':'ok'}${on(o)}" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px" data-s="${o.id}"><div class="t">✉ ${esc(o.combine?'Template for each problem found':(o.template||'No template yet'))}</div>${o.copilot&&!o.combine?`<div class="d">✦ ${esc(o.copilot)}</div>`:o.combine?'<div class="d">✦ Copilot combines them</div>':''}<div class="d">🎫 ${esc((o.ticket||'no ticket yet').split('\n')[0])}</div></div>`}});
 let qb='';const sT=selId&&!selSub?Lt.items.find(x=>x.o&&x.o.id===selId&&x.kind!=='ghost'):null;
 if(sT){const k=sT.kind,g=sT.g,nm={step:'Step',question:'Question',group:'Checks',end:'End'};
  const [lab,types]=k==='step'?['+ Then','step question group'.split(' ')]:k==='question'?['+ New answer',['step','question','group','end']]:k==='group'?['+ Then, if all pass',['step','question','group']]:['+ Before this',['step','question','group']];
  qb=`<div class="qbar" style="left:${(g.x+g.w/2)*zoom}px;top:${(g.y+g.h)*zoom+8}px"><span>${lab}</span>${types.map(t=>`<button data-q="${sT.o.id}|${t}">${nm[t]}</button>`).join('')}</div>`}
 return `<div class="cv" id="cv"><div class="cvs" id="cvs" style="width:${Lt.W*zoom}px;height:${Lt.H*zoom}px"><div class="cvi ${dir}" id="cvi" style="width:${Lt.W}px;height:${Lt.H}px;transform:scale(${zoom})">${html.replace(/^/,'')}<svg class="edges" width="${Lt.W}" height="${Lt.H}"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7D8892"/></marker></defs>${svg}</svg></div>${qb}</div></div>`}
// keep the SVG under the boxes
function fixLayers(){const i=$('#cvi');if(!i)return;const sv=i.querySelector('svg.edges');const firstBox=i.querySelector('.bx,.elab');if(sv&&firstBox)i.insertBefore(sv,firstBox);const s=sop(),Lt=layout(s);i.style.width=Lt.W+'px';i.style.height=Lt.H+'px';const cv=$('#cv');if(cv){i.parentElement.style.setProperty('--w',Lt.W*zoom+'px')}
 const sizer=$('#cvs');if(sizer){sizer.style.width=Lt.W*zoom+'px';sizer.style.height=Lt.H*zoom+'px'}}

/* ---------- panel ---------- */

function runCase(s,PK){const path=[],probs=[],ticks=[],dos=[];let end=null,guard=0;let n=s.root;

  if(n.type==='question'){const a=n.answers.find(x=>x.id===PK.get(n.id))||n.answers[0];path.push({n,a});n=a?a.next:null;continue}
  if(n.type==='group'){path.push({n});const got=[];const r=L=>L.forEach(c=>{const set=PK.get(c.id)||new Set();c.problems.forEach(p=>{if(set.has(p.id)){got.push(p);r(p.follow)}})});r(n.checks);probs.push(...got);n=got.length?n.fail:n.pass;continue}

  if(n.type==='end'){end=n;break}}
 const tpl=[],pts=[];let ticket=[];
 probs.forEach(p=>{if(p.template.trim()&&!tpl.some(x=>x.t===p.template.trim()))tpl.push({t:p.template.trim(),x:p.text});if(p.copilot.trim())pts.push(p.copilot.trim());if(p.ticket.trim())ticket.push(p.ticket.trim());if(p.donow.trim())dos.push(p.donow.trim())});
 if(end){if(!end.combine&&end.template.trim())tpl.push({t:end.template.trim(),x:end.text});if(!end.combine&&end.copilot.trim())pts.push(end.copilot.trim());if(end.ticket.trim())ticket.push(end.ticket.trim())}

  const withText=tpl.filter(x=>x.x&&x.x.trim());if(withText.length){L.push('','Template text I have:');withText.forEach(x=>L.push('['+x.t+']',x.x.trim(),''))}}
