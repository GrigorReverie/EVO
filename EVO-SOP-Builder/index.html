<!doctype html><html><head><meta charset=utf8><title>SOP Builder</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>SOP Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work tool: an SOP is drawn, not filled in
   IDEA a whiteboard process map in four lanes: Find, Review, Act, Finish (check, find the problem, act)
   PICTURE the four-lane diagram itself, editable; the side panel edits the box you clicked
   COLOUR P2A tokens: nav #0D131A, cyan #5BC2E7, link #0A6490; green = pass/OK, amber = problem, never red except delete
   TYPE Inter, 600 for box names
   LAYOUT laptop: four lanes + docked panel; tablet: lanes + panel drawer; phone: lanes stacked, panel as a sheet */
:root{--bg:#F4F5F7;--card:#FFFFFF;--ink:#14191F;--mute:#5B6570;--line:#D9DDE2;--soft:#EEF1F4;--lane:#FBFCFD;--nav:#0D131A;--navink:#F2F5F8;--cyan:#5BC2E7;--link:#0A6490;--sel:#E3F4FB;--okc:#1F7A52;--okbg:#E6F4EC;--amb:#8A5A00;--ambbg:#FFF4DB;--ambl:#E9C46A;--dang:#B3261E;--r:10px;--sh:0 1px 2px rgba(13,19,26,.06),0 3px 10px rgba(13,19,26,.05);color-scheme:light}
:root[data-theme="dark"]{--bg:#0F1419;--card:#182029;--ink:#E8EDF2;--mute:#9AA6B2;--line:#2C3743;--soft:#202A35;--lane:#131A21;--nav:#070B0F;--navink:#E8EDF2;--link:#7CCDEE;--sel:#173444;--okc:#7BD3A6;--okbg:#16302A;--amb:#F2C66D;--ambbg:#33290F;--ambl:#6B5520;--dang:#FF8A80;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1419;--card:#182029;--ink:#E8EDF2;--mute:#9AA6B2;--line:#2C3743;--soft:#202A35;--lane:#131A21;--nav:#070B0F;--navink:#E8EDF2;--link:#7CCDEE;--sel:#173444;--okc:#7BD3A6;--okbg:#16302A;--amb:#F2C66D;--ambbg:#33290F;--ambl:#6B5520;--dang:#FF8A80;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(2.5vw,16px,env(safe-area-inset-left,0px));padding-right:max(2.5vw,16px,env(safe-area-inset-right,0px));max-width:1720px;margin:0 auto}
header{background:var(--nav);color:var(--navink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:31}
.bar{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--cyan);display:inline-block}
.brand small{font-weight:500;color:#9AA6B2;font-size:12px}
.hb{background:transparent;border:1px solid #33404D;color:var(--navink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.hb:hover{border-color:var(--cyan)}
.hb.pri{background:var(--cyan);border-color:var(--cyan);color:#0D131A;font-weight:600}
.hb.todo{border-color:var(--ambl);color:#F2C66D}
.sopbar{display:flex;gap:10px;align-items:center;padding-block:12px 0;flex-wrap:wrap}
.sopbar input.ttl{flex:1 1 320px;min-width:0;font-size:24px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;margin-left:-8px}
.sopbar input.ttl:hover,.sopbar input.ttl:focus{border-color:var(--line);background:var(--card);outline:none}
.whenrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.whenrow label{font-size:13px;color:var(--mute);font-weight:600}
.whenrow input{flex:1 1 300px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;color:var(--mute);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--cyan)}
main{padding-block:16px 60px}
.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;min-width:0}
textarea.in{resize:vertical;min-height:40px;line-height:1.4}
.in:focus{outline:2px solid var(--cyan);outline-offset:-1px;border-color:var(--cyan)}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px;font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--link);color:var(--link)}
.btn.pri{background:var(--link);border-color:var(--link);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:#0D131A}
.btn.del:hover{color:var(--dang);border-color:var(--dang)}
.btn.sure{color:#fff;background:var(--dang);border-color:var(--dang)}
.muted{color:var(--mute);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* canvas */
.work{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.work>*{min-width:0}
.lanes{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr) minmax(0,.85fr) minmax(0,.85fr);gap:12px;align-items:start}
.lane{background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.lh{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:6px;margin:2px 2px 10px}
.lh .k{width:20px;height:20px;border-radius:6px;background:var(--nav);color:var(--navink);display:grid;place-items:center;font-size:11px}
.lh small{text-transform:none;letter-spacing:0;font-weight:500}
.nd{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;box-shadow:var(--sh);position:relative}
.nd:hover,.ck:hover{border-color:var(--link)}
.on{outline:3px solid var(--cyan);outline-offset:1px}
.nd .t{font-weight:600;overflow-wrap:anywhere}
.nd .d{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.nd .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--nav);color:var(--navink);font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
.nd.st{border-color:var(--ink)}
.nd.qu{background:var(--sel);border-color:var(--link)}
.nd.qu .t{color:var(--link)}
.nd.qu .t::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--link);color:var(--card);font-size:12px;margin-right:7px;vertical-align:1px}
.arr{text-align:center;color:var(--mute);font-size:16px;line-height:1;padding:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:12.5px;font-weight:600;border-radius:20px;padding:3px 10px;background:var(--ambbg);border:1px solid var(--ambl);color:var(--ink);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ok{background:var(--okbg);border-color:var(--okc);color:var(--okc)}
.chip.sel{outline:2px solid var(--cyan);outline-offset:1px}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#D99A00;margin-left:5px;vertical-align:1px}
.chip .end{margin-left:5px;font-size:10px}
.br{margin-top:8px;border:1px solid var(--ambl);background:var(--card);border-radius:8px;padding:8px 10px;font-size:12.5px}
.br.g{border-color:var(--okc)}
.br .bh{font-weight:700;font-size:11.5px;color:var(--amb);margin-bottom:4px}
.br.g .bh{color:var(--okc)}
.br .ln{overflow-wrap:anywhere;margin:2px 0}
.br .ln b{font-weight:600;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.br .ft{margin-top:6px;font-size:11.5px;color:var(--mute)}
.br .ft.end{color:var(--ink);font-weight:600}
.br .sub{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.grp{border:1.8px dashed var(--link);border-radius:12px;padding:10px;background:transparent;cursor:pointer}
.grp .gh{font-weight:700;color:var(--link);font-size:13.5px;margin:0 2px 8px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.grp .gh small{font-weight:500;color:var(--mute)}
.grp .cks{display:flex;flex-direction:column;gap:7px}
.ck{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.ck .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.ck .chips{margin-top:6px}
.fu{margin:6px 0 0 10px;padding-left:10px;border-left:2px solid var(--ambl);display:flex;flex-direction:column;gap:6px}
.fu .if{font-size:11.5px;color:var(--amb);font-weight:600}
.addck{margin-top:8px;font-size:13px;min-height:36px;border-style:dashed}
.adds{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.adds button{flex:1 1 auto;border:1.5px dashed var(--line);background:transparent;border-radius:8px;padding:7px 8px;cursor:pointer;color:var(--link);font-weight:600;font-size:13px;white-space:nowrap}
.adds button:hover{border-color:var(--link);background:var(--sel)}
.act{border-radius:10px;padding:11px 12px;cursor:pointer;border:1.5px solid}
.act+.act,.fin+.fin{margin-top:10px}
.act.pass{background:var(--okbg);border-color:var(--okc)}
.act.prob{background:var(--ambbg);border-color:var(--ambl)}
.act .h,.fin .h{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.act.pass .h{color:var(--okc)}.act.prob .h{color:var(--amb)}
.act .ln,.fin .ln{font-size:13px;overflow-wrap:anywhere;margin:3px 0}
.act .ln b,.fin .ln b{font-weight:600;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.fin{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.fin .mail{font-size:12.5px;white-space:pre-wrap;color:var(--ink);background:var(--soft);border-radius:6px;padding:8px;margin-top:6px;max-height:190px;overflow:hidden}
.fin .mail i{color:var(--amb);font-style:normal;font-weight:600}
.try{width:100%;margin-top:10px;background:var(--link);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
:root[data-theme="dark"] .try{color:#0D131A}
.empty{font-size:12.5px;color:var(--mute);padding:6px 2px}
/* panel */
.panel{background:var(--card);border:2px solid var(--link);border-radius:12px;padding:16px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.panel .pk{position:sticky;top:-16px;margin:-16px -16px 0;padding:14px 16px 8px;background:var(--card);z-index:2;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--link);text-transform:uppercase;display:flex;align-items:center}
.panel .pk .x{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--mute);padding:0 4px}
.panel h3{margin:4px 0 2px;font-size:18px;overflow-wrap:anywhere}
.panel details.it{border:1px solid var(--ambl);background:var(--ambbg);border-radius:8px;padding:8px 10px;margin-top:8px}
.panel details.it.okk{border-color:var(--okc);background:var(--okbg)}
.panel details.it>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:6px;align-items:center}
.panel details.it>summary::-webkit-details-marker{display:none}
.panel details.it>summary::before{content:"▸";color:var(--mute)}
.panel details.it[open]>summary::before{content:"▾"}
.panel details.it .in{background:var(--card)}
.panel .sec{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--mute);text-transform:uppercase;margin-top:16px}
.cb{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px}
.cb input{width:18px;height:18px}
.ph{color:var(--mute);font-size:13.5px}
.ph ul{padding-left:18px;margin:8px 0}
.ph li{margin-bottom:5px}
.todos{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.todos button{text-align:left;border:1px solid var(--ambl);background:var(--ambbg);color:var(--amb);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px}
.good{background:var(--okbg);color:var(--okc);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
/* details tab */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.two>*{min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
h2{font-size:15px;margin:0 0 6px}
.watch li{display:flex;gap:6px;margin-bottom:6px}
.watch ol{padding:0;margin:8px 0 0;list-style:none}
/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(7,11,15,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(5vh,16px) 16px 16px;overflow:auto}
.dlg{background:var(--card);color:var(--ink);border:2px solid var(--cyan);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(760px,100%);padding:20px}
.dlg.wide{width:min(1040px,100%)}
.dlg h2{font-size:18px;display:flex;align-items:center;gap:8px}
.dlg h2 .btn{margin-left:auto}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:50vh;overflow:auto}
.li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.li:hover{border-color:var(--link)}
.li.on{border-color:var(--cyan);background:var(--sel);outline:0}
.li .t{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.li .s{font-size:12px;color:var(--mute);white-space:nowrap}
pre.out{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto;margin:8px 0}
.tryg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:10px}
.tryg>*{min-width:0}
.trow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.trow .t{font-weight:600;font-size:14px}
.trow .chips .chip{cursor:pointer;opacity:.55;background:var(--soft);border-color:var(--line);color:var(--ink)}
.trow .chips .chip.on{opacity:1;outline:0;background:var(--ambbg);border-color:var(--ambl)}
.trow .chips .chip.ok.on{background:var(--okbg);border-color:var(--okc);color:var(--okc)}
.trow.sub{margin-left:16px;border-left:3px solid var(--ambl)}
.stage-t{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--mute);text-transform:uppercase;margin:10px 0 6px}
.endnote{background:var(--nav);color:var(--navink);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:var(--navink);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.how ol{margin:6px 0 0 18px;padding:0}.how li{margin-bottom:6px}
.report li{margin-bottom:4px}
@media (max-width:1380px){.work{grid-template-columns:minmax(0,1fr)}.panel{position:fixed;top:auto;right:16px;bottom:16px;width:min(390px,calc(100% - 32px));max-height:min(78vh,760px);z-index:40;box-shadow:0 18px 50px rgba(0,0,0,.3)}.panel.idle{display:none}}
@media (max-width:1100px){.lanes{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}}
@media (max-width:700px){.lanes{grid-template-columns:minmax(0,1fr)}.two,.row2,.tryg{grid-template-columns:minmax(0,1fr)}.panel{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px))}.brand small{display:none}.sopbar input.ttl{font-size:21px}}
</style>

<header><div class="wrap bar">
 <div class="brand"><i></i>SOP Builder <small>4.1 · Find, Review, Act, Finish</small></div>
 <button class="hb" id="bSops">SOPs</button>
 <button class="hb" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
 <button class="hb todo" id="bTodo" hidden></button>
 <button class="hb" id="bHow">How to</button>
 <button class="hb" id="bTheme" aria-label="Switch light or dark">Light / dark</button>
 <button class="hb pri" id="bDl">Download SOP file</button>
</div></header>
<div class="wrap">
 <div class="sopbar"><input class="ttl" id="ttl" data-id="sop" data-k="title" aria-label="SOP title" placeholder="SOP title"><span class="muted" id="stat"></span></div>
 <div class="whenrow"><label for="when">When to use</label><input class="in" id="when" data-id="sop" data-k="when" placeholder="The member’s issue, e.g. A member asks why their account is not approved yet"></div>
 <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="map">Diagram</button><button class="tab" role="tab" data-tab="details">Details</button></div>
</div>
<main class="wrap" id="main"></main>
<input type="file" id="file" accept=".md,.txt,text/markdown,text/plain" hidden>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const VERSION='4.1',KEY='evosb41:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}},raw(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}};

/* ---------- model ----------
 sop.find / sop.review = ordered lists of nodes:
   step     {type:'step',name,detail}
   question {type:'question',name,question,detail,answers:[ans]}   ans {label,ok,words,donow,reply,ticket,email,end,follow:[nodes]}
   group    {type:'group',name,checks:[check]}                      check {name,detail,question,problems:[prob]}  prob {label,words,donow,reply,ticket,email,end,follow:[checks]}
 sop.act.pass {action,email,body,ticket}  sop.act.prob {action,ticket}  sop.fin {open,close} */
const mkStep=(o={})=>({id:uid(),type:'step',name:'',detail:'',...o});
const mkAns=(o={})=>({id:uid(),label:'',ok:false,words:'',donow:'',reply:'',ticket:'',email:'',end:false,follow:[],...o});
const mkQ=(o={})=>({id:uid(),type:'question',name:'',question:'',detail:'',answers:[mkAns({label:'Yes',ok:true}),mkAns({label:'No'})],...o});
const mkProb=(o={})=>({id:uid(),label:'',words:'',donow:'',reply:'',ticket:'',email:'',end:false,follow:[],...o});
const mkCheck=(o={})=>({id:uid(),name:'',detail:'',question:'',problems:[],...o});
const mkGroup=(o={})=>({id:uid(),type:'group',name:'Review',checks:[],...o});
const base=()=>({id:uid(),title:'New SOP',tags:'',when:'',applies:'',topic:'',confluence:'',status:'Draft',links:[],find:[],review:[],act:{pass:{action:'',email:'',body:'',ticket:''},prob:{action:'',ticket:''}},fin:{open:'Hi XXX,\n\nThank you for your message. Before we can go ahead, we need:',close:'Once we have these, we will take another look.\n\nThank you,'},watch:[],emails:{},meta:{name:'',role:'',notes:''},updated:Date.now()});
function blank(){const s=base();s.find=[mkStep({name:'Find the member in back office',detail:'Search by name, then narrow by email.'})];s.review=[mkGroup({name:'Review'})];return s}
function example(){const s=base();s.title='Account approval: driving record (example)';s.tags='account not approved, driving record, pending account';s.topic='Registration';
 s.when='A member sent their driving record and asks why the account is not approved yet.';s.applies='Pending accounts';
 const P=(label,reply,ticket,o={})=>mkProb({label,reply,ticket,...o});
 s.find=[mkStep({name:'Find the member in back office',detail:'Search by name, then narrow by email.'}),
  mkQ({name:'Driving record',question:'Is the upload a driving record?',detail:'A licence photo is not a driving record.',answers:[mkAns({label:'Yes',ok:true}),
   mkAns({label:'Licence instead',words:'sent my licence, uploaded licence',donow:'Add a profile note.',reply:'your driving record (you sent your licence, which we cannot use instead)',ticket:'-Licence uploaded instead of driving record, requested record'}),
   mkAns({label:'No account found',words:'not found, no account',reply:'the email address you signed up with',ticket:'-No account found under name and email given',end:true})]})];
 s.review=[mkGroup({name:'Account review',checks:[

/* ---------- tree helpers ---------- */
function walk(s,fn){ // fn(obj,kind,list,parent)
 const nodes=(L,par)=>L.forEach(n=>{fn(n,n.type,L,par);if(n.type==='question')n.answers.forEach(a=>{fn(a,'answer',n.answers,n);nodes(a.follow,a)});if(n.type==='group')checks(n.checks,n)});
 const checks=(L,par)=>L.forEach(c=>{fn(c,'check',L,par);c.problems.forEach(p=>{fn(p,'problem',c.problems,c);checks(p.follow,p)})});
 nodes(s.find,'find');nodes(s.review,'review')}
function find(id){const s=sop();if(id==='sop')return{o:s,kind:'sop'};if(id==='pass')return{o:s.act.pass,kind:'pass'};if(id==='prob')return{o:s.act.prob,kind:'prob'};if(id==='fin')return{o:s.fin,kind:'fin'};
 let r=null;walk(s,(o,kind,list,par)=>{if(!r&&o.id===id)r={o,kind,list,par}});return r}

let cur=store.get('cur',S[0].id);if(!S.find(x=>x.id===cur))cur=S[0].id;
let tab='map',selId=null,selSub=null;
const sop=()=>S.find(x=>x.id===cur);
const undo=[];let lastSnap=JSON.stringify(sop()),saveT=null,drawT=null;
function save(){const s=sop();s.updated=Date.now();const j=JSON.stringify(s);if(j!==lastSnap){undo.push({id:s.id,j:lastSnap});if(undo.length>80)undo.shift();lastSnap=j}
 clearTimeout(saveT);saveT=setTimeout(()=>{store.set('sops',S);store.set('cur',cur)},250)}
function doUndo(){const u=undo.pop();if(!u){toast('Nothing to undo');return}if(u.restore&&!S.find(x=>x.id===u.id)){S.unshift(JSON.parse(u.j));cur=u.id;lastSnap=u.j;store.set('sops',S);render();toast('SOP restored');return}
 const i=S.findIndex(x=>x.id===u.id);if(i<0)return;S[i]=JSON.parse(u.j);cur=u.id;lastSnap=u.j;if(selId&&!find(selId))selId=null;store.set('sops',S);render();toast('Undone')}

function todos(){const s=sop(),T=[];
 if(!s.when.trim())T.push({id:'sop',m:'When to use is empty'});
 walk(s,(o,kind,list,par)=>{
  if((kind==='step'||kind==='check')&&!o.name.trim())T.push({id:o.id,m:'A '+kind+' has no name'});
  if(kind==='question'){if(!o.question.trim()&&!o.name.trim())T.push({id:o.id,m:'A question has no text'});if(!o.answers.some(a=>!a.ok))T.push({id:o.id,m:'"'+(o.name||o.question)+'" has no problem answer'})}
  if(kind==='group'&&!o.checks.length)T.push({id:o.id,m:'Group "'+o.name+'" has no checks'});
  if(kind==='check'&&!o.problems.length)T.push({id:o.id,m:'"'+(o.name||'Check')+'" has no problems yet'});
  if((kind==='problem'||(kind==='answer'&&!o.ok))){const nm='"'+(o.label||'…')+'"';if(!o.label.trim())T.push({id:par.id,sub:o.id,m:'An answer has no name'});
   else if(!o.reply.trim()&&!o.email.trim())T.push({id:par.id,sub:o.id,m:nm+' has no reply line'});
   else if(!o.ticket.trim())T.push({id:par.id,sub:o.id,m:nm+' has no ticket line'})}});
 if(!s.act.pass.action.trim())T.push({id:'pass',m:'All pass: what does the agent do?'});
 if(!s.act.pass.ticket.trim())T.push({id:'pass',m:'All pass has no ticket'});
 return T}

function buildCase(s,picks){ // picks: Map id -> answerId (question) or Set of problemIds (check)
 const R=[],TK=[],DO=[];let ended=null;const P=picks||new Map();
 const take=o=>{if(o.reply.trim())R.push(o.reply.trim());if(o.ticket.trim())TK.push(o.ticket.trim());if(o.donow.trim())DO.push(o.donow.trim());if(o.end&&!ended)ended=o.label};
 const nodes=L=>L.forEach(n=>{if(ended)return;if(n.type==='question'){const a=n.answers.find(x=>x.id===P.get(n.id))||n.answers.find(x=>x.ok);if(a&&!a.ok){take(a)}if(a&&!ended)nodes(a.follow)}if(n.type==='group')checks(n.checks)});
 const checks=L=>L.forEach(c=>{if(ended)return;const set=P.get(c.id)||new Set();c.problems.forEach(p=>{if(set.has(p.id)){take(p);checks(p.follow)}})});
 nodes(s.find);nodes(s.review);
 const prob=R.length+TK.length>0||ended;let email='',ticket='';
 if(prob){email=R.length?s.fin.open.trim()+'\n\n'+R.map(x=>'- '+x).join('\n')+'\n\n'+s.fin.close.trim():'';ticket=[...TK,...(ended?[]:(s.act.prob.ticket.trim()?[s.act.prob.ticket.trim()]:[]))].join('\n')}
 else{email=s.act.pass.body.trim();ticket=s.act.pass.ticket.trim()}
 return {prob,email,ticket,DO,ended,action:ended?'Case ends: '+ended:prob?s.act.prob.action:s.act.pass.action}}
function tryDlg(){const s=sop(),P=new Map();
 const draw=d=>{const nodes=(L,sub)=>L.map(n=>{if(n.type==='step')return `<div class="trow${sub?' sub':''}"><div class="t">${esc(n.name)}</div></div>`;
   if(n.type==='question'){const sel=P.get(n.id)||(n.answers.find(a=>a.ok)||{}).id;const a=n.answers.find(x=>x.id===sel);return `<div class="trow${sub?' sub':''}"><div class="t">${esc(n.question||n.name)}</div><div class="chips">${n.answers.map(x=>`<span class="chip${x.ok?' ok':''}${x.id===sel?' on':''}" data-pq="${n.id}|${x.id}">${esc(x.label)}${x.end?' ■':''}</span>`).join('')}</div></div>${a?nodes(a.follow,true):''}`}
   if(n.type==='group')return `<div class="stage-t" style="text-transform:none;letter-spacing:0">${esc(n.name)} · any order</div>`+checks(n.checks,sub);return ''}).join('');
  const checks=(L,sub)=>L.map(c=>{const set=P.get(c.id)||new Set();return `<div class="trow${sub?' sub':''}"><div class="t">${esc(c.name)}</div><div class="chips"><span class="chip ok${set.size?'':' on'}" data-pc="${c.id}|pass">Pass</span>${c.problems.map(p=>`<span class="chip${set.has(p.id)?' on':''}" data-pc="${c.id}|${p.id}">${esc(p.label)}${p.end?' ■':''}</span>`).join('')}</div></div>${c.problems.filter(p=>set.has(p.id)).map(p=>checks(p.follow,true)).join('')}`}).join('');
  const out=buildCase(s,P);
  d.querySelector('#tl').innerHTML=`<div class="stage-t">1 · Find</div>${nodes(s.find)}<div class="stage-t">2 · Review</div>${nodes(s.review)}`;
  d.querySelector('#tr').innerHTML=`<div class="stage-t">3 · Act</div><div class="${out.ended?'endnote':out.prob?'act prob':'act pass'}" style="cursor:default">${esc(out.action||'—')}</div>${out.DO.length?`<div class="muted" style="margin-top:6px">Do now: ${esc(out.DO.join(' · '))}</div>`:''}
  <div class="stage-t">4 · Finish: email</div><pre class="out" id="tEm">${esc(out.email||'No email')}</pre><button class="btn" data-cp="tEm">Copy email</button>
  <div class="stage-t">Ticket</div><pre class="out" id="tTk">${esc(out.ticket||'No ticket')}</pre><button class="btn" data-cp="tTk">Copy ticket</button>`};
 openDlg(`<h2>Try a case <button class="btn" data-close>Close</button></h2><div class="muted">Tap what you would find. Nothing tapped = everything passes. Nothing is saved.</div><div class="tryg"><div id="tl"></div><div id="tr"></div></div>`,d=>{draw(d);
  d.addEventListener('click',e=>{const q=e.target.closest('[data-pq]'),c=e.target.closest('[data-pc]'),cp=e.target.closest('[data-cp]');
   if(q){const [n,a]=q.dataset.pq.split('|');P.set(n,a);draw(d)}
   if(c){const [id,p]=c.dataset.pc.split('|');const set=new Set(P.get(id)||[]);if(p==='pass')set.clear();else set.has(p)?set.delete(p):set.add(p);P.set(id,set);draw(d)}
   if(cp){copy(d.querySelector('#'+cp.dataset.cp).textContent)}})})}

const one=t=>String(t||'').replace(/\s*\n\s*/g,' ').trim();
const nl=t=>String(t||'').trim().replace(/\n/g,'\\n');
function items(s){const I=[];
 const nodes=(L,stage,fol)=>L.forEach(n=>{if(n.type==='group'){n.checks.forEach(c=>check(c,stage,n.name,fol));return}const it={o:n,kind:n.type,stage,fol};I.push(it);it.n=I.length;
  if(n.type==='question')n.answers.forEach(a=>{if(!a.ok&&a.follow.length)nodes(a.follow,stage,{n:it.n,label:a.label})})});
 const check=(c,stage,g,fol)=>{const it={o:c,kind:'check',stage,group:g,fol};I.push(it);it.n=I.length;c.problems.forEach(p=>p.follow.forEach(f=>check(f,stage,g,{n:it.n,label:p.label})))};
 nodes(s.find,'find');nodes(s.review,'review');return I}
function toMd(s){s=s||sop();const I=items(s),L=[];
 L.push('# SOP for P2A: '+one(s.title),'');if(s.meta.name||s.meta.role)L.push('From: '+one(s.meta.name)+(s.meta.role?' ('+one(s.meta.role)+')':''));
 L.push('Sent: '+new Date().toISOString().slice(0,10),'Made with: SOP Builder '+VERSION);if(s.meta.notes.trim())L.push('Notes: '+one(s.meta.notes));
 L.push('','## SOP','','Title: '+one(s.title));if(s.tags.trim())L.push('Tags: '+one(s.tags));if(s.topic.trim())L.push('Topic: '+one(s.topic));
 if(s.when.trim()||s.applies.trim())L.push('When to use: '+one(s.when)+(s.applies.trim()?' | Applies to: '+one(s.applies):''));
 if(s.confluence.trim())L.push('Confluence: '+one(s.confluence));const ln=s.links.filter(l=>l.u.trim());if(ln.length){L.push('Tool links:');ln.forEach(l=>L.push('- '+one(l.l||l.u)+': '+one(l.u)))}
 L.push('','Steps:');I.forEach(it=>{const o=it.o,nm=it.kind==='question'?(o.name||o.question):o.name;L.push(it.n+'. '+one(nm||'Step '+it.n)+(o.detail&&o.detail.trim()?' — '+one(o.detail):''))});
 const okN=I.length+1;if(s.act.pass.action.trim())L.push(okN+'. '+one(s.act.pass.action));
 const Q=I.filter(it=>(it.o.question||'').trim());if(Q.length){L.push('','Questions:');Q.forEach(it=>L.push('- Step '+it.n+': '+one(it.o.question)))}
 const ans=it=>it.kind==='question'?it.o.answers.filter(a=>!a.ok):it.kind==='check'?it.o.problems:[];
 L.push('','Outcomes:');I.forEach(it=>ans(it).forEach(a=>L.push('- At step '+it.n+': '+one(a.label||'Answer')+' -> '+(one(a.email)||'-')+(a.words.trim()?' | '+one(a.words):'')+(a.end?' | then: stop':''))));
 const only=new Map();I.filter(it=>it.fol).forEach(it=>{const k=it.fol.label;if(!only.has(k))only.set(k,[]);only.get(k).push(it.n)});only.forEach((v,k)=>L.push('- Only when '+one(k)+': step '+v.join(', ')));
 if(s.act.pass.action.trim())L.push('- Only when all OK: step '+okN);if(s.act.pass.email.trim())L.push('- All OK -> '+one(s.act.pass.email));
 const D=[];I.forEach(it=>ans(it).forEach(a=>{if(a.donow.trim())D.push('- '+one(a.label)+': '+one(a.donow))}));if(D.length)L.push('','Do now:',...new Set(D));
 const RL=[];I.forEach(it=>ans(it).forEach(a=>{if(a.reply.trim())RL.push('- At step '+it.n+': '+one(a.label)+': '+one(a.reply))}));
 if(RL.length)L.push('','Reply lines:',...RL);
 const T=[];I.forEach(it=>ans(it).forEach(a=>{if(a.ticket.trim())T.push('- At step '+it.n+': '+one(a.label)+': '+nl(a.ticket))}));if(s.act.pass.ticket.trim())T.push('- All OK: '+nl(s.act.pass.ticket));if(s.act.prob.ticket.trim())T.push('- Any problem: '+nl(s.act.prob.ticket));
 if(T.length)L.push('','Ticket lines:',...T);
 L.push('','Act:','- All pass: '+one(s.act.pass.action),'- Any problem: '+one(s.act.prob.action));
 L.push('','Email frame:','- Opening: '+nl(s.fin.open),'- Closing: '+nl(s.fin.close));
 L.push('','Stages:');I.forEach(it=>{const p=['- Step '+it.n+': '+it.stage,it.kind];if(it.group)p.push('group: '+one(it.group));if(it.kind==='question'){const ok=it.o.answers.find(a=>a.ok);if(ok)p.push('ok: '+one(ok.label))}if(it.fol)p.push('follow of step '+it.fol.n+': '+one(it.fol.label));L.push(p.join(' | '))});
 const W=s.watch.filter(w=>w.trim());if(W.length)L.push('','Watch out for:',...W.map(w=>'- '+one(w)));
 const E=new Map();if(s.act.pass.email.trim()&&s.act.pass.body.trim())E.set(s.act.pass.email.trim(),s.act.pass.body);
 walk(s,(o,k)=>{if((k==='answer'||k==='problem')&&o.email.trim()&&(s.emails[o.email.trim()]||'').trim())E.set(o.email.trim(),s.emails[o.email.trim()])});
 if(E.size){L.push('','## Replies');E.forEach((b,t)=>L.push('','### Reply: '+t,String(b).replace(/^#{1,6}\s+/gm,'').trim()))}
 return L.join('\n').replace(/\n{3,}/g,'\n\n')+'\n'}

/* ---------- import ---------- */
function parseMd(txt){const P={title:'',tags:'',topic:'',conf:'',when:'',applies:'',links:[],meta:{name:'',role:'',notes:''},steps:{},qs:{},outs:[],dn:{},rl:[],tk:[],okOnly:[],only:[],after:[],def:'',act:{},frame:{},stages:{},watch:[],open:[],replies:{}};
 const lines=String(txt||'').replace(/\r/g,'').split('\n');const top=lines.findIndex(l=>/^##\s+(reply templates|replies|ticket templates)\b/i.test(l));const body=top>=0?lines.slice(0,top):lines,rep=top>=0?lines.slice(top):[];
 const h1=body.find(l=>/^#\s+/.test(l));if(h1)P.title=h1.replace(/^#\s+(SOP for P2A:|P2A package:)?\s*/i,'').trim();let sec='';
 for(const raw of body){const l=raw.trim();let m;if(!l)continue;
  if(m=l.match(/^title\s*:\s*(.+)$/i)){P.title=m[1].trim();continue}if(m=l.match(/^tags\s*:\s*(.*)$/i)){P.tags=m[1].trim();continue}if(m=l.match(/^topic\s*:\s*(.*)$/i)){P.topic=m[1].trim();continue}if(m=l.match(/^confluence\s*:\s*(.*)$/i)){P.conf=m[1].trim();continue}
  if(!sec&&(m=l.match(/^from\s*:\s*(.*?)(?:\s*\((.*)\))?$/i))){P.meta.name=m[1].trim();P.meta.role=(m[2]||'').trim();continue}if(!sec&&(m=l.match(/^notes\s*:\s*(.+)$/i))){P.meta.notes=m[1].trim();continue}
  if(m=l.match(/^when to use\s*:\s*(.*)$/i)){const p=m[1].split(/\|\s*applies to\s*:/i);P.when=p[0].trim();P.applies=(p[1]||'').trim();continue}
  if(m=l.match(/^(tool links|steps|questions|outcomes?|do now|reply lines|ticket lines|act|email frame|stages|watch out for|open points|clarifications)\s*:\s*$/i)){sec=m[1].toLowerCase();continue}
  if(/^#/.test(l)||/^(sent|made with)\s*:/i.test(l))continue;const it=l.replace(/^[-*•]\s*/,'');
  if(sec==='steps'&&(m=l.match(/^(\d+)[.)]\s*(.+)$/))){const p=m[2].split(/\s+[—–]\s+/);P.steps[+m[1]]={name:p[0].trim(),detail:p.slice(1).join(' — ').trim()};continue}
  if(sec==='tool links'&&(m=it.match(/^(.*?):\s*(https?:\/\/\S+)$/))){P.links.push({l:m[1].trim(),u:m[2]});continue}
  if(sec==='questions'&&(m=it.match(/^step\s+(\d+)\s*:\s*(.+)$/i))){P.qs[+m[1]]=m[2].trim();continue}
  if(sec.startsWith('outcome')){
   if(m=it.match(/^at step (\d+)\s*:\s*(.+)$/i)){const p=m[2].split(/\s*(?:->|→|=>)\s*/),a=(p.slice(1).join(' -> ')||'').split('|').map(x=>x.trim());let th='';const k=a.findIndex((x,q)=>q>0&&/^then\s*:/i.test(x));if(k>0){th=a[k].replace(/^then\s*:/i,'').trim();a.splice(k,1)}P.outs.push({n:+m[1],label:p[0].trim(),email:a[0]&&a[0]!=='-'?a[0]:'',words:a.slice(1).filter(Boolean).join(', '),then:th});continue}
   if(m=it.match(/^only when all ok\s*:\s*(.+)$/i)){P.okOnly=(m[1].match(/\d+/g)||[]).map(Number);continue}
   if(m=it.match(/^after step (\d+)\s*:\s*(.+)$/i)){P.after.push({n:+m[1],to:m[2].trim()});continue}
   if(m=it.match(/^(?:default|all ok)\s*(?:->|→|=>|:)\s*(.+)$/i)){P.def=m[1].trim();continue}
   if(m=it.match(/^only when (.+?)\s*:\s*(?:steps?\s*)?([\d,\s]+)$/i)){P.only.push({label:m[1].trim(),steps:(m[2].match(/\d+/g)||[]).map(Number)});continue}}
  if(sec==='do now'&&(m=it.match(/^(.+?)\s*:\s*(.+)$/))){P.dn[m[1].trim().toLowerCase()]=m[2].trim();continue}
  if(sec==='reply lines'&&(m=it.match(/^at step (\d+)\s*:\s*(.+?)\s*:\s*(.+)$/i))){P.rl.push({n:+m[1],label:m[2].trim().toLowerCase(),t:m[3].trim()});continue}
  if(sec==='ticket lines'){const un=x=>x.replace(/\\n/g,'\n');if(m=it.match(/^all ok\s*:\s*(.+)$/i)){P.act.passTicket=un(m[1].trim());continue}if(m=it.match(/^any problem\s*:\s*(.+)$/i)){P.act.probTicket=un(m[1].trim());continue}if(m=it.match(/^at step (\d+)\s*:\s*(.+?)\s*:\s*(.+)$/i)){P.tk.push({n:+m[1],label:m[2].trim().toLowerCase(),t:un(m[3].trim())});continue}}
  if(sec==='act'){if(m=it.match(/^all pass\s*:\s*(.*)$/i)){P.act.pass=m[1].trim();continue}if(m=it.match(/^any problem\s*:\s*(.*)$/i)){P.act.prob=m[1].trim();continue}}
  if(sec==='email frame'){if(m=it.match(/^opening\s*:\s*(.*)$/i)){P.frame.open=m[1].replace(/\\n/g,'\n');continue}if(m=it.match(/^closing\s*:\s*(.*)$/i)){P.frame.close=m[1].replace(/\\n/g,'\n');continue}}
  if(sec==='stages'&&(m=it.match(/^step (\d+)\s*:\s*(.+)$/i))){const p=m[2].split('|').map(x=>x.trim()),o={stage:p[0].toLowerCase()==='find'?'find':'review',kind:p[1]||'check'};p.slice(2).forEach(x=>{let q;if(q=x.match(/^group\s*:\s*(.*)$/i))o.group=q[1];else if(q=x.match(/^ok\s*:\s*(.*)$/i))o.ok=q[1];else if(q=x.match(/^follow of step (\d+)\s*:\s*(.*)$/i))o.fol={n:+q[1],label:q[2]}});P.stages[+m[1]]=o;continue}
  if(sec==='watch out for'){P.watch.push(it);continue}if(sec==='open points'){P.open.push(it);continue}}
 let curT=null,buf=[];const flush=()=>{if(curT)P.replies[curT]=buf.join('\n').trim();curT=null;buf=[]};
 rep.forEach(l=>{let m;if(m=l.match(/^###\s+(?:reply|email)\s*:\s*(.+)$/i)){flush();curT=m[1].trim();return}if(/^###?\s/.test(l)){flush();return}if(curT&&!/^tags\s*:/i.test(l))buf.push(l)});flush();return P}
function fromMd(txt){const P=parseMd(txt),R=[],s=base();s.title=P.title||'Imported SOP';s.tags=P.tags;s.topic=P.topic;s.confluence=P.conf;s.when=P.when;s.applies=P.applies;s.links=P.links;s.meta=P.meta;s.watch=P.watch;
 if(P.frame.open)s.fin.open=P.frame.open;if(P.frame.close)s.fin.close=P.frame.close;
 const okSet=new Set(P.okOnly);const nums=Object.keys(P.steps).map(Number).sort((a,b)=>a-b).filter(n=>!okSet.has(n));
 if(P.okOnly.length)s.act.pass.action=P.okOnly.map(n=>P.steps[n]?P.steps[n].name:'').filter(Boolean).join('; ');
 if(P.act.pass)s.act.pass.action=P.act.pass;if(P.act.prob)s.act.prob.action=P.act.prob;if(P.act.passTicket)s.act.pass.ticket=P.act.passTicket;if(P.act.probTicket)s.act.prob.ticket=P.act.probTicket;
 if(P.def&&P.def!=='-'){s.act.pass.email=P.def;s.act.pass.body=P.replies[P.def]||''}
 const outsAt=n=>P.outs.filter(o=>o.n===n);
 const fill=(o,n)=>{const lab=o.label.toLowerCase();const r=P.rl.find(x=>x.n===n&&x.label===lab),t=P.tk.find(x=>x.n===n&&x.label===lab);if(r)o.reply=r.t;if(t)o.ticket=t.t;if(P.dn[lab])o.donow=P.dn[lab];if(o.email&&P.replies[o.email])s.emails[o.email]=P.replies[o.email];return o};
 const mkAnswers=n=>outsAt(n).map(o=>fill(mkAns({label:o.label,email:o.email,words:o.words,end:/^(stop|end)/i.test(o.then)}),n));
 const mkProbs=n=>outsAt(n).map(o=>fill(mkProb({label:o.label,email:o.email,words:o.words,end:/^(stop|end)/i.test(o.then)}),n));
 const own=Object.keys(P.stages).length>0,obj={};
 // which step each "Only when" step follows (old files)
 const folOf={};if(!own)P.only.forEach(g=>{const owner=P.outs.find(o=>o.label.toLowerCase()===g.label.toLowerCase());if(owner)g.steps.forEach(n=>{if(!okSet.has(n))folOf[n]={n:owner.n,label:owner.label}})});
 const findN=own?null:(nums.length?nums[0]:null);
 nums.forEach(n=>{const st=P.steps[n];const g=own?(P.stages[n]||{stage:'review',kind:'check',group:'Review'}):{stage:n===findN?'find':'review',kind:n===findN?(P.qs[n]||outsAt(n).length?'question':'step'):'check',group:'Review',fol:folOf[n]};
  let o;if(g.kind==='question'){o=mkQ({name:st.name,question:P.qs[n]||'',detail:st.detail,answers:[mkAns({label:g.ok||'Yes',ok:true}),...mkAnswers(n)]})}else if(g.kind==='step'){o=mkStep({name:st.name,detail:st.detail})}else{o=mkCheck({name:st.name,detail:st.detail,question:P.qs[n]||'',problems:mkProbs(n)})}
  obj[n]={o,g};
  if(g.fol&&obj[g.fol.n]){const par=obj[g.fol.n].o,lab=g.fol.label.toLowerCase();const host=(par.answers||par.problems||[]).find(x=>x.label.toLowerCase()===lab);
   if(host){if(par.problems&&o.type){o=mkCheck({name:o.name,detail:o.detail,question:o.question||'',problems:o.answers?o.answers.filter(a=>!a.ok).map(a=>mkProb(a)):[]});obj[n].o=o}
    if(par.answers&&!o.type){o=mkStep({name:o.name,detail:o.detail});obj[n].o=o}
    host.follow.push(o);return}}
  const list=s[g.stage];if(g.kind==='check'){let last=list[list.length-1];if(!last||last.type!=='group'||last.name!==(g.group||'Review')){last=mkGroup({name:g.group||'Review'});list.push(last)}last.checks.push(o)}else list.push(o)});
 if(!own){if(findN!=null)R.push('Step '+findN+' went to Find; the other steps became one check group in Review (any order). Move any that must come first with "Move to Find".');
  if(P.okOnly.length)R.push('Step '+P.okOnly.join(', ')+' ran only when all OK, so it is now the All pass action.');
  if(Object.keys(folOf).length)R.push('Steps '+Object.keys(folOf).join(', ')+' only ran for one answer, so they now sit under that answer.');
  P.after.forEach(a=>R.push('"After step '+a.n+': '+a.to+'" has no place in 4.1; check the order.'));
  P.outs.filter(o=>o.then&&!/^(stop|end)/i.test(o.then)).forEach(o=>R.push('"'+o.label+'" said then: '+o.then+'. 4.1 has no skips; check it.'));
  const ne=P.outs.filter(o=>o.email).length;if(ne)R.push(ne+' answers keep their P2A email template. Add short reply lines when you can.')}
 if(P.open.length){s.meta.notes=(s.meta.notes?s.meta.notes+'\n':'')+'Open points: '+P.open.join(' / ');R.push(P.open.length+' open point(s) moved to Notes (Details).')}
 if(!s.find.length&&!s.review.length){s.find.push(mkStep({name:'Find the member in back office'}));R.push('No steps found, so it starts with one step.')}
 return {s,R}}
function from40(o){if(!o||!Array.isArray(o.checks))return null;const s=base();Object.assign(s,{title:o.title||'SOP',tags:o.tags||'',when:o.when||'',applies:o.applies||'',topic:o.topic||'',confluence:o.confluence||'',status:o.status||'Draft',links:o.links||[],watch:o.watch||[],emails:o.emails||{},meta:o.meta||s.meta});
 const conv=(a,P)=>P({label:a.label||'',words:a.words||'',donow:a.donow||'',ticket:a.ticket||'',email:a.email||'',end:a.then&&a.then.t==='end'});
 o.checks.forEach((c,i)=>{const real=c.answers.filter(a=>!a.ok&&!a.other);if(i===0){s.find.push(mkQ({name:c.name,question:c.question,detail:c.detail,answers:[mkAns({label:(c.answers.find(a=>a.ok)||{}).label||'Yes',ok:true}),...real.map(a=>conv(a,mkAns))]}));return}
  let g=s.review[0];if(!g){g=mkGroup({name:'Review'});s.review.push(g)}g.checks.push(mkCheck({name:c.name,detail:c.detail,question:c.question,problems:real.map(a=>conv(a,mkProb))}))});
 const ok=o.allok||{};s.act.pass={action:ok.action||'',email:ok.email||'',body:(o.emails||{})[ok.email]||'',ticket:ok.ticket||''};s.title=s.title+(/\(4\.0\)$/.test(s.title)?'':' (from 4.0)');return s}
