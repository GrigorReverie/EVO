<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>SOP Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky top bar with three tabs (How to, Diagram, Details); the Diagram is a spine of steps with outcomes branching left and right. Tokens follow P2A's palette so the two feel like one product. */
:root{
 --bg:#f4f7f9;--card:#ffffff;--ink:#16202b;--mut:#5a6876;--line:#d4dce3;--soft:#eef3f6;
 --acc:#0b7fa8;--accbg:#e2f3f9;--onacc:#ffffff;

 --shadow:0 10px 28px rgba(16,32,43,.16);--dot:#bfcbd6;
 --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --f-head:"Space Grotesk",Inter,system-ui,sans-serif;
 --f-mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--card:#17202a;--ink:#e7edf3;--mut:#9aa8b6;--line:#2b3846;--soft:#1c2733;--acc:#5bc2e7;--accbg:#12313d;--onacc:#06202b;--amb:#f2c96b;--ambbg:#382c10;--ambbd:#7a6220;--red:#ff9aa0;--redbg:#3d1a1d;--grn:#7fd6a0;--grnbg:#143021;--blu:#9db9ff;--blubg:#1a2744;--shadow:0 10px 28px rgba(0,0,0,.5);--dot:#34424f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151b;--card:#17202a;--ink:#e7edf3;--mut:#9aa8b6;--line:#2b3846;--soft:#1c2733;--acc:#5bc2e7;--accbg:#12313d;--onacc:#06202b;--amb:#f2c96b;--ambbg:#382c10;--ambbd:#7a6220;--red:#ff9aa0;--redbg:#3d1a1d;--grn:#7fd6a0;--grnbg:#143021;--blu:#9db9ff;--blubg:#1a2744;--shadow:0 10px 28px rgba(0,0,0,.5);--dot:#34424f;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}.brand b{font-family:var(--f-head);font-size:17px;font-weight:700;letter-spacing:-.01em}.brand span{font-size:12px;color:var(--mut);font-weight:600}
.pick{display:flex;gap:6px;align-items:center;flex:1;min-width:220px}.pick select{flex:1;min-width:0;max-width:340px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.tabs button{border:0;background:transparent;padding:5px 14px;cursor:pointer;font-weight:600;font-size:13px}.tabs button[aria-selected=true]{background:var(--acc);color:var(--onacc)}
.saved{font-size:12px;color:var(--mut)}.saved.no{color:var(--amb);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.4}.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.btn.sm{font-size:12px;padding:3px 10px}.btn.danger{color:var(--red)}.btn.armed,.ic.armed{background:var(--redbg);border-color:var(--red);color:var(--red)}
.ic{border:1px solid transparent;background:transparent;border-radius:7px;cursor:pointer;color:var(--mut);padding:1px 7px;font-size:14px;line-height:1.4}.ic:hover{background:var(--soft);color:var(--ink)}.ic:disabled{opacity:.3;cursor:default}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.h{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.h .n{text-transform:none;letter-spacing:0;font-weight:400}
details.card>summary{cursor:pointer;list-style:none}details.card>summary::-webkit-details-marker{display:none}details.card>summary:before{content:"▸";font-size:11px;color:var(--mut)}details.card[open]>summary:before{content:"▾"}details.card[open]>summary{margin-bottom:10px}
.wo{background:var(--ambbg);border-color:var(--ambbd)}.wo .h{color:var(--amb)}

.help{font-size:12px;color:var(--mut);margin:4px 0 0}

.li{display:flex;gap:6px;align-items:center;padding:3px 0}.li .f{flex:1}

.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid}
.leg .e{background:var(--ambbg);border-color:var(--ambbd)}.leg .p{background:var(--blubg);border-color:var(--blu)}.leg .x{background:var(--redbg);border-color:var(--red)}
.att{font-size:12px;font-weight:600;color:var(--amb);background:var(--ambbg);border:1px solid var(--ambbd);border-radius:999px;padding:2px 10px;cursor:pointer}.att.ok{color:var(--grn);background:var(--grnbg);border-color:var(--grn);cursor:default}
.cvw{position:relative;margin:0 auto;max-width:100%}
.cv{height:max(360px,56vh);position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background-color:var(--soft);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.5px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.cv.pan{cursor:grabbing}.cv input,.cv textarea,.cv select{user-select:text;-webkit-user-select:text}
.dg{position:absolute;left:0;top:0;width:1400px;display:flex;flex-direction:column;align-items:stretch;transform-origin:0 0;padding:16px 0 40px}
.rs{position:absolute;bottom:0;width:24px;height:24px;z-index:5;touch-action:none;opacity:.6}.rs:hover{opacity:1}
.rs.r{right:0;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--acc) 50%,var(--acc) 57%,transparent 57%,transparent 69%,var(--acc) 69%,var(--acc) 76%,transparent 76%)}
.rs.l{left:0;cursor:nesw-resize;background:linear-gradient(225deg,transparent 50%,var(--acc) 50%,var(--acc) 57%,transparent 57%,transparent 69%,var(--acc) 69%,var(--acc) 76%,transparent 76%)}
.zm{display:inline-flex;gap:4px;align-items:center}.zm span{font-size:12px;font-weight:600;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}

.kid span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kid:hover{border-color:var(--acc)}.kid.emp span{color:var(--mut)}.kid.warn span{color:var(--amb);font-weight:600}

.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px) minmax(0,1fr);gap:0 48px;align-items:center}

.pt.l{left:-11px}.pt.r{right:-11px}

.dgn{position:relative;border-radius:4px;touch-action:none}.dob{touch-action:none}
.dgn.q{isolation:isolate;border-color:transparent!important;background:var(--line);padding-left:26px;padding-right:26px;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);box-shadow:none}

.dob{border-radius:999px;padding:5px 14px}

<script>
(function(){
'use strict';
const KEY='sopBuilder.v1',UIKEY='sopBuilder.ui.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const low=s=>String(s||'').trim().toLowerCase();
const isUrl=u=>/^https?:\/\/\S+$/i.test(String(u||'').trim());

const EXAMPLE=`# SOP for P2A: Parking permit request (example)

From: Example
Notes for import: This is the example that comes with the builder.

## SOP

Title: Parking permit request (example)
Tags: Permits, parking

Steps:
1. Find the member in back office — Search by name, then narrow by email.
2. Check the account is active — Suspended or closed accounts cannot get a permit.
3. Check the vehicle details — Plate, make and colour are filled in and match the photo.
4. Check the permit is not already issued — One permit per vehicle at a time.
5. Issue the permit, or leave on hold — Hold: leave the request open and note what we are waiting for.

Outcomes:
- At step 1: No account found -> ACCOUNT NOT FOUND
- At step 2: Account suspended -> ACCOUNT SUSPENDED | suspended, closed account
- At step 3: Plate missing -> PLATE NEEDED | no plate, plate not entered
- At step 3: Photo does not match -> PHOTO DOES NOT MATCH
- At step 4: Permit already issued -> PERMIT ALREADY ISSUED | already have a permit
- Only when all OK: step 5

Do now:
- Account suspended: Do not issue a permit. Note why in the profile.
- Permit already issued: Do not issue a second permit.

Watch out for:
- Never issue a permit for a plate that belongs to another member.
- A temporary paper plate is not a valid plate.

## Replies

### Reply: PLATE NEEDED
Hi XXX,

Thanks for your permit request. We still need the licence plate for your vehicle. Please reply with the plate number and we will issue your permit right away.

## Tickets

### Ticket: PLATE NEEDED
Permit request missing the plate number. Asked the member to send it. Request left open.
`;

/* ---------- model ---------- */
function blank(){return{id:uid(),title:'',topic:'',tags:'',confluence:'',author:'',role:'',notes:'',steps:[],watch:[],links:[],ok:{tpl:'',text:'',ticket:'',only:''},example:false,created:Date.now(),updated:Date.now()}}
function mkStep(name,detail){return{id:uid(),name:name||'',detail:detail||'',outs:[]}}
function mkOut(o){return Object.assign({id:uid(),label:'',kind:'email',tpl:'',text:'',ticket:'',doNow:'',words:'',side:'',then:'',only:[]},o||{})}

/* ---------- read an SOP text (this builder's file, or plain P2A SOP text) ---------- */
function parseAny(raw){
 const t=String(raw||'').replace(/^\ufeff/,'').replace(/\r\n?/g,'\n'),o=blank(),mail={},tick={},outs=[],dn={},lks=[],onlyA=[];let okTpl='',only=0,m;
 const h1=t.match(/^#\s+(.+?)\s*#*$/m);
 if(m=t.match(/^From:\s*(.+?)(?:\s*\(([^)]*)\))?\s*$/m)){if(!/^(not given|example)$/i.test(m[1].trim())){o.author=m[1].trim();o.role=(m[2]||'').trim()}}
 if(m=t.match(/^Notes(?: for (?:import|Grigor))?:\s*(.+)$/m))o.notes=m[1].trim();
 if(m=t.match(/^Title:\s*(.+)$/m))o.title=m[1].trim();else if(h1)o.title=h1[1].replace(/^SOP for P2A:\s*/i,'').replace(/[*_`]/g,'').trim();
 if(m=t.match(/^Tags?:\s*(.+)$/m)){const a=m[1].split(/[,;]/).map(x=>x.trim()).filter(Boolean);o.topic=a[0]||'';o.tags=a.slice(1).join(', ')}
 let sec='',cur=null;
 t.split('\n').forEach(line=>{
  const hm=line.match(/^(#{2,3})\s+(.+?)\s*#*$/);
  if(hm){const x=hm[2].replace(/[*_`]/g,'').trim();
   if(hm[1]==='##'){sec=/^repl/i.test(x)?'replies':/^ticket/i.test(x)?'tickets':'';cur=null;return}
   if(sec==='replies'||sec==='tickets'){cur={t:x.replace(/^(reply|ticket)\s*[:\-–—]\s*/i,'').trim(),L:[]};(sec==='replies'?mail:tick)[low(cur.t)]=cur;return}}
  if(sec==='replies'||sec==='tickets'){if(cur)cur.L.push(line);return}
  const hh=line.match(/^\s*(Steps|Outcomes|Do now|Watch out for|Tool links?|Tools and links|Rules|Escalate when|Sources)\s*:\s*$/i);if(hh){sec=hh[1].toLowerCase();return}
  const x=line.trim();if(!x)return;
  if(sec==='steps'){const s=x.match(/^(\d+)[.)]\s*(.+?)(?:\s+[—–]\s+(.*))?$/);if(s)o.steps.push(mkStep(s[2].trim(),(s[3]||'').trim()))}
  else if(sec==='outcomes'){let r=x.match(/^[-*•]?\s*At step (\d+)\s*:\s*(.+?)\s*(?:->|→|=>)\s*(.*)$/i);
   if(r){const p=r[3].split('|').map(z=>z.trim());let th='';const q=p.findIndex((z,k)=>k>0&&/^then\s*:/i.test(z));if(q>0){th=p[q].replace(/^then\s*:/i,'').trim();p.splice(q,1)}outs.push({n:+r[1],label:r[2].trim(),tpl:p[0]||'',words:p.slice(1).filter(Boolean).join(' | '),then:th});return}
   if(r=x.match(/^[-*•]?\s*(?:All OK|Default)\s*(?:->|→|=>|:)\s*(.+)$/i)){okTpl=r[1].trim();return}
   if(r=x.match(/^[-*•]?\s*Only when all OK\s*:\s*step\s*(\d+)/i)){only=+r[1];return}
   if(r=x.match(/^[-*•]?\s*Only when (.+?)\s*:\s*(?:steps?\s*)?([\d,\s]+)$/i))onlyA.push({label:r[1].trim(),steps:(r[2].match(/\d+/g)||[]).map(Number)})}
  else if(sec==='do now'){const r=x.match(/^[-*•]?\s*(.+?):\s+(.+)$/);if(r)dn[low(r[1])]=r[2].trim()}
  else if(sec==='watch out for'){o.watch.push(x.replace(/^[-*•]\s*/,''))}
  else if(/^tool|^tools/.test(sec)){const u=x.match(/https?:\/\/[^\s)>\]]+/);let lab=x.replace(/^[-*•]\s*/,'');if(u)lab=lab.slice(0,lab.indexOf(u[0]));lab=lab.replace(/[\s:|–—(\[-]+$/,'').trim();
   let st=0;const sm=lab.match(/\s*\((?:step|at step)\s*(\d+)\)\s*$/i);if(sm){st=+sm[1];lab=lab.slice(0,sm.index).trim()}
   const sm2=x.match(/\|\s*step\s*(\d+)\s*$/i);if(sm2)st=+sm2[1];
   if(u&&/^confluence( page)?$/i.test(lab)&&!o.confluence){o.confluence=u[0];return}
   lks.push({id:uid(),name:lab||(u?u[0]:''),url:u?u[0]:'',st})}
 });
 const body=c=>c?c.L.join('\n').replace(/^\n+|\s+$/g,''):'';
 outs.forEach(u=>{const s=o.steps[u.n-1];if(!s)return;const kind=u.tpl==='-'?'path':u.tpl?'email':'none';
  s.outs.push(mkOut({label:u.label,kind,tpl:kind==='email'?u.tpl:'',words:u.words,doNow:dn[low(u.label)]||'',text:kind==='email'?body(mail[low(u.tpl)]):'',ticket:kind==='email'?body(tick[low(u.tpl)]):''}))});
 const thenOf=v=>{v=String(v||'').trim();let q;if(!v||/^(continue|next)$/i.test(v))return '';if(/^(stop|end|stop here)$/i.test(v))return 'stop';if(q=v.match(/^(?:go to\s+)?step\s+(\d+)$/i))return o.steps[+q[1]-1]?o.steps[+q[1]-1].id:'';if(q=v.match(/^sop\s*:?\s*(.+)$/i))return 'sop:'+q[1].trim();return ''};
 outs.forEach(u=>{const s=o.steps[u.n-1];if(!s)return;const x=s.outs.find(y=>y.label===u.label);if(x)x.then=thenOf(u.then)});
 onlyA.forEach(g=>o.steps.forEach(s=>s.outs.forEach(x=>{if(low(x.label)===low(g.label))x.only=g.steps.map(n=>o.steps[n-1]&&o.steps[n-1].id).filter(Boolean)})));
 o.links=lks.map(k=>({id:k.id,name:k.name,url:k.url,step:k.st&&o.steps[k.st-1]?o.steps[k.st-1].id:''}));
 if(okTpl&&okTpl!=='-'){o.ok.tpl=okTpl;o.ok.text=body(mail[low(okTpl)]);o.ok.ticket=body(tick[low(okTpl)])}
 if(only&&o.steps[only-1])o.ok.only=o.steps[only-1].id;
 return o}

/* ---------- write the file P2A imports (Architecture > SOPs > Import) ---------- */
const one=s=>String(s||'').replace(/\s*\n+\s*/g,' ').trim();
const cl=s=>one(s).replace(/\s*(->|→|=>)\s*/g,' - ').replace(/\|/g,'/');
function safeBody(s){return String(s||'').replace(/\r\n?/g,'\n').split('\n').map(l=>l.replace(/^\s*#+\s*/,'').replace(/^\s*>\s?/,'').replace(/^(\s*)tip\s*:/i,'$1Tip -')).join('\n').replace(/^\n+|\s+$/g,'')}
function thenTxt(o,idx){const v=o.then||'';if(v==='stop')return 'stop';if(/^sop:/.test(v))return 'SOP '+cl(v.slice(4));if(v){const n=idx(v);return n?'step '+n:''}return ''}
function exportText(S){
 const idx=id=>S.steps.findIndex(s=>s.id===id)+1,title=cl(S.title)||'Untitled SOP',D=new Date().toISOString().slice(0,10);
 let t='# SOP for P2A: '+title+'\n\nFrom: '+(cl(S.author)||'not given')+(one(S.role)?' ('+one(S.role).replace(/[()]/g,'')+')':'')+'\nSent: '+D+'\nMade with: SOP Builder 1.3\n';
 if(one(S.notes))t+='Notes for import: '+one(S.notes)+'\n';
 t+='\n## SOP\n\nTitle: '+title+'\n';
 const tags=[S.topic,...String(S.tags||'').split(',')].map(x=>cl(x).replace(/,/g,'')).filter(Boolean);if(tags.length)t+='Tags: '+tags.join(', ')+'\n';
 const L=[];if(isUrl(S.confluence))L.push('- Confluence page: '+S.confluence.trim());
 S.links.forEach(k=>{if(!isUrl(k.url))return;const i=k.step?idx(k.step):0;L.push('- '+(cl(k.name).replace(/:/g,' ')||'Link')+(i?' (step '+i+')':'')+': '+k.url.trim())});
 if(L.length)t+='Tool links:\n'+L.join('\n')+'\n';
 t+='\nSteps:\n'+S.steps.map((s,i)=>(i+1)+'. '+(cl(s.name).replace(/\s+[—–]\s+/g,', ')||'Step '+(i+1))+(one(s.detail)?' — '+one(s.detail):'')).join('\n')+'\n';
 const O=[];S.steps.forEach((s,i)=>s.outs.forEach(o=>{if(!cl(o.label))return;const tp=o.kind==='path'?'-':o.kind==='email'?cl(o.tpl):'';const th=thenTxt(o,idx);O.push('- At step '+(i+1)+': '+cl(o.label).replace(/:/g,' -')+' -> '+tp+(cl(o.words)?' | '+cl(o.words):'')+(th?' | then: '+th:''))}));
 if(cl(S.ok.tpl))O.push('- All OK -> '+cl(S.ok.tpl));
 if(S.ok.only&&idx(S.ok.only))O.push('- Only when all OK: step '+idx(S.ok.only));
 S.steps.forEach(s=>s.outs.forEach(o=>{const n=[...new Set((o.only||[]).map(idx).filter(Boolean))].sort((a,b)=>a-b);if(cl(o.label)&&n.length&&low(cl(o.label))!=='all ok')O.push('- Only when '+cl(o.label).replace(/:/g,' -')+': step '+n.join(', '))}));
 if(O.length)t+='\nOutcomes:\n'+O.join('\n')+'\n';
 const DN=[];S.steps.forEach(s=>s.outs.forEach(o=>{if(cl(o.label)&&one(o.doNow))DN.push('- '+cl(o.label).replace(/:/g,' -')+': '+one(o.doNow))}));
 if(DN.length)t+='\nDo now:\n'+DN.join('\n')+'\n';
 const W=S.watch.map(one).filter(Boolean);if(W.length)t+='\nWatch out for:\n'+W.map(w=>'- '+w).join('\n')+'\n';
 const R=new Map(),T=new Map();
 const take=(tp,text,ticket)=>{const k=low(cl(tp));if(!k)return;if(safeBody(text)&&!R.has(k))R.set(k,[cl(tp),safeBody(text)]);if(safeBody(ticket)&&!T.has(k))T.set(k,[cl(tp),safeBody(ticket)])};
 S.steps.forEach(s=>s.outs.forEach(o=>{if(o.kind==='email')take(o.tpl,o.text,o.ticket)}));take(S.ok.tpl,S.ok.text,S.ok.ticket);
 if(R.size)t+='\n## Replies\n'+[...R.values()].map(([n,b])=>'\n### Reply: '+n+'\n'+b+'\n').join('');
 if(T.size)t+='\n## Tickets\n'+[...T.values()].map(([n,b])=>'\n### Ticket: '+n+'\n'+b+'\n').join('');
 return t}

/* ---------- storage (this browser only) ---------- */
let DB={cur:'',sops:{}},S=null,canSave=true;
let ui={tab:'howto',view:'web',secs:{},open:new Set(),oOpen:new Set(),menu:null,sel:null,arm:null,focus:null,cvW:0,cvH:0};
try{const r=localStorage.getItem(KEY);if(r){const j=JSON.parse(r);if(j&&j.sops&&typeof j.sops==='object')DB=j}}catch(e){canSave=false}
try{const r=localStorage.getItem(UIKEY);if(r){const j=JSON.parse(r);if(j){if(j.tab)ui.tab=j.tab;if(j.view)ui.view=j.view;if(j.secs)ui.secs=j.secs;if(j.cvW)ui.cvW=j.cvW;if(j.cvH)ui.cvH=j.cvH}}}catch(e){}
function fresh(){const e=parseAny(EXAMPLE);e.example=true;DB.sops[e.id]=e;return e}
if(!Object.keys(DB.sops).length){const e=fresh();DB.cur=e.id}
S=DB.sops[DB.cur]||Object.values(DB.sops)[0];DB.cur=S.id;
let saveT;
function save(){S.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));canSave=true}catch(e){canSave=false}savedLabel()},250)}
function saveUi(){try{localStorage.setItem(UIKEY,JSON.stringify({tab:ui.tab,view:ui.view,secs:ui.secs,cvW:ui.cvW,cvH:ui.cvH}))}catch(e){}}
function savedLabel(){const el=$('#saved');el.className='saved'+(canSave?'':' no');el.textContent=canSave?'Saved in this browser':'Not saved: copy your text before you close'}

/* ---------- helpers for views ---------- */
const sideOf=(o,j)=>o.side||(j%2?'l':'r');
const findStep=id=>S.steps.find(s=>s.id===id);
function cons(o){const c=cons0(o),v=o.then||'';if(v==='stop')c.t+=' · ■ stop';else if(/^sop:/.test(v))c.t+=' · → SOP';else if(v){const n=stepNo(v);if(n)c.t+=' · → '+n}return c}
function cons0(o){if(o.kind==='path')return{t:'Choose a path'+(o.words?' · '+o.words:''),w:false};
 if(o.kind==='none')return{t:'No email'+(o.doNow?' · do now':''),w:false};
 if(!o.tpl.trim())return{t:'Email needs a name',w:true};
 return{t:'✉ '+o.tpl+(o.text.trim()?'':' (existing)')+(o.ticket.trim()?' · ticket':'')+(o.doNow.trim()?' · do now':''),w:false}}
function sec(id,cls,title,note,body){const open=!!ui.secs[id];return '<details class="card '+cls+'" data-sec="'+id+'"'+(open?' open':'')+'><summary class="h">'+title+' <span class="n">'+note+'</span></summary>'+body+'</details>'}
function emailNames(){const n=new Map();S.steps.forEach(s=>s.outs.forEach(o=>{if(o.kind==='email'&&o.tpl.trim())n.set(low(o.tpl),o.tpl.trim())}));if(S.ok.tpl.trim())n.set(low(S.ok.tpl),S.ok.tpl.trim());return[...n.values()]}
function users(tp,except){const k=low(tp);if(!k)return[];const a=[];S.steps.forEach(s=>s.outs.forEach(o=>{if(o!==except&&o.kind==='email'&&low(o.tpl)===k)a.push(o.label||'an outcome')}));if(except!=='ok'&&low(S.ok.tpl)===k)a.push('Everything OK');return a}
function checks(){const A=[],seen=new Map();
 if(!S.title.trim())A.push({t:'Give the SOP a name (Details tab).',go:'details'});
 if(!S.steps.length)A.push({t:'Add at least one step.',go:'build'});
 if(S.steps.length>12)A.push({t:S.steps.length+' steps is long to follow under pressure. If it has two paths, it may be two SOPs.',soft:1});
