<!doctype html><html><head><meta charset=utf8><title>SOP Builder</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>SOP Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for one SOP writer (Grigor and team leads)
   IDEA a call-centre checklist card: checks down the page, each with its answer table, like a printed decision sheet
   PICTURE the answer table of the selected check, large, beside the list of checks; diagram drawn from it
   COLOUR P2A tokens: nav #0D131A, cyan #5BC2E7, link #0A6490, amber for hints only, never red except delete
   TYPE Inter for everything, 600 for names
   LAYOUT laptop: checks list left 340px, editor right; phone: list, then editor, rows become cards */
:root{--bg:#F4F5F7;--card:#FFFFFF;--ink:#14191F;--mute:#5B6570;--line:#D9DDE2;--soft:#EEF1F4;--nav:#0D131A;--navink:#F2F5F8;--cyan:#5BC2E7;--link:#0A6490;--sel:#E3F4FB;--okc:#1F7A52;--okbg:#E6F4EC;--amb:#8A5A00;--ambbg:#FFF4DB;--ambl:#E9C46A;--dang:#B3261E;--r:10px;--sh:0 1px 2px rgba(13,19,26,.06),0 4px 14px rgba(13,19,26,.05);color-scheme:light}
:root[data-theme="dark"]{--bg:#0F1419;--card:#182029;--ink:#E8EDF2;--mute:#9AA6B2;--line:#2C3743;--soft:#202A35;--nav:#070B0F;--navink:#E8EDF2;--link:#7CCDEE;--sel:#173444;--okc:#7BD3A6;--okbg:#16302A;--amb:#F2C66D;--ambbg:#33290F;--ambl:#6B5520;--dang:#FF8A80;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1419;--card:#182029;--ink:#E8EDF2;--mute:#9AA6B2;--line:#2C3743;--soft:#202A35;--nav:#070B0F;--navink:#E8EDF2;--link:#7CCDEE;--sel:#173444;--okc:#7BD3A6;--okbg:#16302A;--amb:#F2C66D;--ambbg:#33290F;--ambl:#6B5520;--dang:#FF8A80;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header{background:var(--nav);color:var(--navink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:21}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--cyan);display:inline-block}
.brand small{font-weight:500;color:#9AA6B2;font-size:12px}
.hb{background:transparent;border:1px solid #33404D;color:var(--navink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.hb:hover{border-color:var(--cyan)}
.hb.pri{background:var(--cyan);border-color:var(--cyan);color:#0D131A;font-weight:600}
.sopbar{display:flex;gap:10px;align-items:center;padding-block:14px 4px;flex-wrap:wrap}
.sopbar input.ttl{flex:1 1 320px;min-width:0;font-size:26px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;margin-left:-8px}
.sopbar input.ttl:hover,.sopbar input.ttl:focus{border-color:var(--line);background:var(--card);outline:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:6px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--cyan)}
.tab .n{font-weight:500;font-size:12px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:4px}
main{padding-block:18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card+.card{margin-top:14px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
h3{font-size:13px;margin:0 0 6px;font-weight:600;color:var(--mute)}
label.f{display:block;font-size:13px;color:var(--mute);margin:0 0 4px;font-weight:500}
.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;min-width:0}
textarea.in{resize:vertical;min-height:40px;line-height:1.4}
.in:focus{outline:2px solid var(--cyan);outline-offset:-1px;border-color:var(--cyan)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.mt{margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--link);color:var(--link)}
.btn.pri{background:var(--link);border-color:var(--link);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:#0D131A}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mute);padding:5px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.del:hover{color:var(--dang);border-color:var(--dang)}
.btn.sure{color:#fff;background:var(--dang);border-color:var(--dang)}
.add{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:var(--r);padding:12px;cursor:pointer;color:var(--link);font-weight:600}
.add:hover{border-color:var(--link);background:var(--sel)}
/* build layout */
.build{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.build>*{min-width:0}
.checks{display:flex;flex-direction:column;gap:10px}
.ck{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh)}
.ck:hover{border-color:var(--link)}
.ck.on{border-color:var(--cyan);background:var(--sel);box-shadow:0 0 0 2px var(--cyan) inset}
.num{width:30px;height:30px;border-radius:8px;background:var(--nav);color:var(--navink);display:grid;place-items:center;font-weight:700;font-size:14px}
.ck .nm{font-weight:600;overflow-wrap:anywhere}
.ck .q{color:var(--mute);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.ck .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pill{font-size:12px;border-radius:20px;padding:2px 9px;background:var(--soft);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--okbg);color:var(--okc)}
.ck .mv{display:flex;flex-direction:column;gap:2px}
.ck .mv button{border:0;background:transparent;color:var(--mute);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:13px}
.ck .mv button:hover{background:var(--soft);color:var(--ink)}
.okcard{border-left:4px solid var(--okc)}
.side h2{display:flex;align-items:center;gap:8px}
.hint{display:flex;gap:8px;align-items:flex-start;background:var(--ambbg);color:var(--amb);border:1px solid var(--ambl);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.hint b{font-weight:600}
.hints{display:flex;flex-direction:column;gap:6px}
.good{background:var(--okbg);color:var(--okc);border-radius:8px;padding:8px 10px;font-size:13px}
details.fold>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::before{content:"▸";color:var(--mute);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary::-webkit-details-marker{display:none}
.watch li{display:flex;gap:6px;margin-bottom:6px}
.watch ol{padding:0;margin:8px 0 0;list-style:none}
/* answer table */
.atable{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ahead{display:none}
.arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px;grid-template-areas:"lab em th x" "wd do tk tk";gap:10px 12px;padding:14px;align-items:start}
.arow.okr{background:var(--okbg)}
.arow.oth{background:var(--soft)}
.arow+.arow{border-top:1px solid var(--line)}
.arow>*{min-width:0}
.c-lab{grid-area:lab}.c-em{grid-area:em}.c-th{grid-area:th}.c-x{grid-area:x;justify-self:end}.c-wd{grid-area:wd}.c-do{grid-area:do}.c-tk{grid-area:tk}
.arow .cl{display:block;font-size:12px;color:var(--mute);margin-bottom:3px;font-weight:500}
.arow textarea.in{min-height:38px;font-size:14px;padding:7px 8px}
.arow input.in,.arow select.in{font-size:14px;padding:7px 8px}
.arow .lab{font-weight:600}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--okc);color:var(--card);vertical-align:1px;display:inline-block;margin-top:24px}
.arow .x{margin-top:20px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;padding:6px;border-radius:6px}
.arow .x:hover{color:var(--dang);background:var(--soft)}
.sopin{margin-top:6px}
.edhead{display:flex;gap:12px;align-items:center}
.edhead .num{width:38px;height:38px;font-size:17px}
.edhead input{font-size:19px;font-weight:700}
.muted{color:var(--mute);font-size:13px}
/* emails */
.emails{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.emails>*{min-width:0}
.em .who{font-size:12px;color:var(--mute);margin:4px 0 8px}
.em textarea{min-height:140px}
/* diagram */
.dwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
svg text{font-family:Inter,system-ui,sans-serif}
.dg-ck{cursor:pointer}
.dg-ck:hover rect{stroke:var(--cyan)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:10px 2px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:5px;display:inline-block}
/* drawer & dialogs */
.scrim{position:fixed;inset:0;background:rgba(7,11,15,.55);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:max(6vh,16px) 16px 16px;overflow:auto}
.dlg{background:var(--card);color:var(--ink);border:2px solid var(--cyan);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(720px,100%);padding:20px}
.dlg h2{font-size:18px;display:flex;align-items:center}
.dlg h2 .btn{margin-left:auto}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:50vh;overflow:auto}
.li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.li:hover{border-color:var(--link)}
.li.on{border-color:var(--cyan);background:var(--sel)}
.li .t{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.li .s{font-size:12px;color:var(--mute);white-space:nowrap}
pre.out{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto;margin:10px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:var(--navink);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.how ol{margin:6px 0 0 18px;padding:0}
.how li{margin-bottom:6px}
.report li{margin-bottom:4px}
@media (max-width:1000px){.build{grid-template-columns:290px minmax(0,1fr)}}
@media (max-width:860px){.build{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.row2{grid-template-columns:minmax(0,1fr)}.sopbar input.ttl{font-size:22px}.arow{grid-template-columns:minmax(0,1fr) 34px;grid-template-areas:"lab x" "em em" "th th" "wd wd" "do do" "tk tk"}.brand small{display:none}.card{padding:14px}}
</style>

<header><div class="wrap bar">
 <div class="brand"><i></i>SOP Builder <small>4.0 · checks and answers</small></div>
 <button class="hb" id="bSops">SOPs</button>
 <button class="hb" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
 <button class="hb" id="bHow">How to</button>
 <button class="hb" id="bTheme" aria-label="Switch light or dark">Light / dark</button>
 <button class="hb pri" id="bDl">Download SOP file</button>
</div></header>

<div class="wrap">
 <div class="sopbar"><input class="ttl" id="ttl" data-p="title" aria-label="SOP title" placeholder="SOP title"><span class="muted" id="stat"></span></div>
 <div class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" data-t="build" aria-selected="true">Build</button>
  <button class="tab" role="tab" data-t="emails">Emails <span class="n" id="nEm"></span></button>
  <button class="tab" role="tab" data-t="diagram">Diagram</button>
  <button class="tab" role="tab" data-t="details">Details</button>
 </div>
</div>
<main class="wrap" id="main"></main>
<input type="file" id="file" accept=".md,.txt,text/markdown,text/plain" hidden>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='evosb4:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};
const VERSION='4.0';

/* ---------- model ---------- */
const newAns=(o={})=>({id:uid(),label:'',words:'',donow:'',email:'',ticket:'',then:{t:'next',v:''},...o});
const okAns=(label='Yes, OK')=>newAns({label,ok:true});
const otherAns=()=>newAns({label:'Other',other:true,words:'',donow:'Ask a lead before you go on.',ticket:'Describe what you found and who you asked.',then:{t:'end',v:''}});
const newCheck=(o={})=>({id:uid(),name:'',detail:'',question:'',answers:[okAns(),newAns({label:''}),otherAns()],...o});
const blank=()=>({id:uid(),title:'New SOP',tags:'',when:'',applies:'',topic:'',confluence:'',status:'Draft',links:[],checks:[newCheck({name:'Find the member in back office',detail:'Search by name, then narrow by email.',question:'Did you find the member?',answers:[okAns('Found'),newAns({label:'Not found',then:{t:'end',v:''}}),otherAns()]})],allok:{action:'',email:'',ticket:''},watch:[],emails:{},meta:{name:'',role:'',notes:''},updated:Date.now()});

function example(){
 const A=(label,email,ticket,o={})=>newAns({label,email,ticket,then:{t:'end',v:''},...o});
 return {id:uid(),title:'Parking permit request (example)',tags:'Permits, parking',when:'A member asks for a parking permit for their vehicle.',applies:'Members with an active account',topic:'Permits',confluence:'',status:'Draft',links:[{l:'Back office',u:'https://example.com/back-office'}],
 checks:[
  newCheck({name:'Find the member in back office',detail:'Search by name, then narrow by email.',question:'Did you find the member?',answers:[okAns('Found'),A('No account found','ACCOUNT NOT FOUND','No account found under the name and email given.',{words:'not found, no account'}),otherAns()]}),
  newCheck({name:'Check the account is active',detail:'Suspended or closed accounts cannot get a permit.',question:'Is the account active?',answers:[okAns('Active'),A('Suspended','ACCOUNT SUSPENDED','Account suspended, permit not issued.',{words:'suspended, closed account',donow:'Do not issue a permit. Note why in the profile.'}),otherAns()]}),
  newCheck({name:'Check the vehicle belongs to the member',detail:'The plate is registered in the member’s name.',question:'Is the vehicle registered to the member?',answers:[okAns('Yes, theirs'),A('Someone else’s vehicle','VEHICLE NOT REGISTERED TO MEMBER','Vehicle not registered to the member, asked for proof of ownership.',{words:'friend’s car, family vehicle'}),otherAns()]}),
  newCheck({name:'Check the vehicle details',detail:'Plate, make and colour are filled in and match the photo.',question:'Is the plate in the photo readable and matching?',answers:[okAns('Readable, matches'),A('Plate not readable','PLATE NOT READABLE','Plate not readable, asked for a clearer photo.',{words:'no plate, plate not entered, blurry'}),A('Photo does not match','PHOTO DOES NOT MATCH','Photo does not match the vehicle details, asked for a new photo.'),otherAns()]}),
  newCheck({name:'Check for an existing permit',detail:'One permit per vehicle at a time.',question:'Is a permit already issued for this vehicle?',answers:[okAns('No permit yet'),A('Already issued','PERMIT ALREADY ISSUED','Permit already issued for this vehicle, no second permit.',{words:'already have a permit',donow:'Do not issue a second permit.'}),otherAns()]})
 ],
 allok:{action:'Issue the permit',email:'PERMIT ISSUED',ticket:'All checks passed. Permit issued for the plate on file.'},
 watch:['Never issue a permit for a plate that belongs to another member.','A temporary paper plate is not a valid plate.'],
 emails:{'ACCOUNT NOT FOUND':'Hi XXX,\n\nWe could not find an account under this name and email. Please reply with the email you signed up with.\n\nThank you,','ACCOUNT SUSPENDED':'Hi XXX,\n\nYour account is suspended, so we cannot issue a parking permit right now. Please contact us to resolve the suspension first.\n\nThank you,','VEHICLE NOT REGISTERED TO MEMBER':'Hi XXX,\n\nThe vehicle on your request is not registered in your name. Please send proof that you own or lease it.\n\nThank you,','PLATE NOT READABLE':'Hi XXX,\n\nWe could not read the plate in your photo. Please send a clearer one.\n\nThank you,','PHOTO DOES NOT MATCH':'Hi XXX,\n\nThe photo does not match the vehicle details on your request. Please send a new photo of the vehicle.\n\nThank you,','PERMIT ALREADY ISSUED':'Hi XXX,\n\nThis vehicle already has a permit, and we can only issue one per vehicle at a time.\n\nThank you,','PERMIT ISSUED':'Hi XXX,\n\nYour parking permit is issued. You can see it in the app under Permits.\n\nThank you,'},
 meta:{name:'',role:'',notes:''},updated:Date.now()};
}

let S=store.get('sops',null);
if(!Array.isArray(S)||!S.length){S=[example()];}
let cur=store.get('cur',S[0].id); if(!S.find(x=>x.id===cur))cur=S[0].id;
let sel=0, tab=store.get('tab','build'); if(!['build','emails','diagram','details'].includes(tab))tab='build';
const sop=()=>S.find(x=>x.id===cur);
const undo=[]; let lastSnap=JSON.stringify(sop());
let saveT=null;
function save(push=true){
 const s=sop(); s.updated=Date.now();
 if(push){const j=JSON.stringify(s); if(j!==lastSnap){undo.push({id:s.id,j:lastSnap});if(undo.length>60)undo.shift();lastSnap=j}}
 clearTimeout(saveT); saveT=setTimeout(()=>{store.set('sops',S);store.set('cur',cur)},250);
 $('#stat').textContent='Saved on this device';
}
function doUndo(){const u=undo.pop(); if(!u){toast('Nothing to undo');return}
 const i=S.findIndex(x=>x.id===u.id); if(i<0)return; S[i]=JSON.parse(u.j); cur=u.id; lastSnap=u.j; sel=Math.min(sel,S[i].checks.length-1); store.set('sops',S); render(); toast('Undone');}

/* ---------- helpers ---------- */
const ckIdx=id=>sop().checks.findIndex(c=>c.id===id);
function thenTxt(a,i){const t=a.then||{t:'next'};
 if(t.t==='end')return 'End the case';
 if(t.t==='skip'){const j=ckIdx(t.v);return j>=0?'Skip to check '+(j+1):'Next check'}
 if(t.t==='sop')return 'Open SOP: '+(t.v||'…');
 return i>=sop().checks.length-1?'All OK':'Next check';}
function emailTitles(){const s=sop(),set=new Set(Object.keys(s.emails||{}));s.checks.forEach(c=>c.answers.forEach(a=>{if(a.email.trim())set.add(a.email.trim())}));if(s.allok.email.trim())set.add(s.allok.email.trim());return [...set].filter(Boolean).sort()}
function usedEmails(){const s=sop(),m=new Map();const add=(t,w)=>{t=t.trim();if(!t)return;if(!m.has(t))m.set(t,[]);m.get(t).push(w)};
 s.checks.forEach((c,i)=>c.answers.forEach(a=>add(a.email,'Check '+(i+1)+': '+(a.label||'answer'))));add(s.allok.email,'All OK');return m}

function hints(){const s=sop(),H=[];const n=s.checks.length;
 if(n<3)H.push(['Few checks','Most SOPs need 5 to 7 checks. Is anything the agent must look at missing?']);
 if(n>7)H.push(['Many checks',n+' checks. Aim for 5 to 7: merge checks that look at the same screen, or move detail into Watch out for.']);
 if(!s.when.trim())H.push(['When to use is empty','Say which member issue this SOP is for, so P2A can find it.']);
 s.checks.forEach((c,i)=>{const k='Check '+(i+1);const real=c.answers.filter(a=>!a.other);
  if(!c.name.trim())H.push([k,'has no name.']);
  if(!c.question.trim())H.push([k,'has no question. Write what the agent asks or looks for, e.g. "Is the account active?"']);
  if(real.length>4)H.push([k,real.length+' answers. Keep 2 to 4 (plus Other); split the check if it asks two things.']);
  if(real.length<2)H.push([k,'needs at least one problem answer besides OK.']);
  const seen=new Set();c.answers.forEach(a=>{const l=a.label.trim().toLowerCase();if(!l)H.push([k,'has an answer with no name.']);else if(seen.has(l))H.push([k,'has two answers called "'+a.label+'".']);seen.add(l);
   if(!a.ok&&!a.other&&a.label.trim()&&!a.ticket.trim())H.push([k,'"'+a.label+'" has no ticket line.']);
   if(a.then.t==='sop'&&!a.then.v.trim())H.push([k,'"'+(a.label||'answer')+'" opens another SOP but names none.']);
   if(a.then.t==='skip'&&ckIdx(a.then.v)<=i)H.push([k,'"'+(a.label||'answer')+'" skips to a check that is not later.']);});
 });
 if(!s.allok.ticket.trim())H.push(['All OK','has no ticket line, so a clean case gets no ticket.']);
 usedEmails().forEach((w,t)=>{if(!(s.emails[t]||'').trim())H.push(['Email "'+t+'"','has no text yet. Write it in Emails, or P2A will use a template with that title.'])});
 if(s.watch.length>4)H.push(['Watch out for',s.watch.length+' items. Keep the 2 to 4 that cause real mistakes.']);
 return H}

function diagramHtml(){const s=sop(),C=s.checks;const X0=70,BW=270,PX=X0+BW+70,PW=230,EX=PX+PW+40,PH=30,GAP=10;let y=24;const rows=[];

/* ---------- export in the P2A import format ---------- */
function toMd(s){s=s||sop();const C=s.checks,L=[];const one=t=>String(t||'').replace(/\s*\n\s*/g,' ').trim();
 L.push('# SOP for P2A: '+one(s.title),'');
 if(s.meta.name||s.meta.role)L.push('From: '+one(s.meta.name)+(s.meta.role?' ('+one(s.meta.role)+')':''));
 L.push('Sent: '+new Date().toISOString().slice(0,10),'Made with: SOP Builder '+VERSION);
 if(s.meta.notes.trim())L.push('Notes: '+one(s.meta.notes));
 L.push('','## SOP','','Title: '+one(s.title));
 if(s.tags.trim())L.push('Tags: '+one(s.tags));
 if(s.topic.trim())L.push('Topic: '+one(s.topic));
 if(s.when.trim()||s.applies.trim())L.push('When to use: '+one(s.when)+(s.applies.trim()?' | Applies to: '+one(s.applies):''));
 if(s.confluence.trim())L.push('Confluence: '+one(s.confluence));
 const ln=s.links.filter(l=>l.u.trim());if(ln.length){L.push('Tool links:');ln.forEach(l=>L.push('- '+one(l.l||l.u)+': '+one(l.u)))}
 L.push('','Steps:');C.forEach((c,i)=>L.push((i+1)+'. '+one(c.name||'Check '+(i+1))+(c.detail.trim()?' — '+one(c.detail):'')));
 const okN=C.length+1;if(s.allok.action.trim())L.push(okN+'. '+one(s.allok.action));
 const Q=C.map((c,i)=>[i,c]).filter(([i,c])=>c.question.trim());if(Q.length){L.push('','Questions:');Q.forEach(([i,c])=>L.push('- Step '+(i+1)+': '+one(c.question)))}
 L.push('','Outcomes:');
 C.forEach((c,i)=>c.answers.forEach(a=>{if(a.ok)return;const th=a.then.t==='end'?'stop':a.then.t==='skip'&&ckIdx(a.then.v)>i?'step '+(ckIdx(a.then.v)+1):a.then.t==='sop'&&a.then.v.trim()?'SOP '+one(a.then.v):'';
  L.push('- At step '+(i+1)+': '+one(a.label||'Answer')+' -> '+(one(a.email)||'-')+(a.words.trim()?' | '+one(a.words):'')+(th?' | then: '+th:''))}));
 C.forEach((c,i)=>{const a=c.answers.find(x=>x.ok);if(!a)return;if(a.then.t==='end')L.push('- After step '+(i+1)+': stop');else if(a.then.t==='skip'&&ckIdx(a.then.v)>i)L.push('- After step '+(i+1)+': step '+(ckIdx(a.then.v)+1))});
 if(s.allok.action.trim())L.push('- Only when all OK: step '+okN);
 if(s.allok.email.trim())L.push('- All OK -> '+one(s.allok.email));
 const D=[];C.forEach(c=>c.answers.forEach(a=>{if(a.donow.trim())D.push('- '+one(a.label||'Answer')+': '+one(a.donow))}));
 if(D.length)L.push('','Do now:',...[...new Set(D)]);
 const T=[];C.forEach((c,i)=>c.answers.forEach(a=>{if(a.ticket.trim())T.push('- At step '+(i+1)+': '+one(a.label||'Answer')+': '+one(a.ticket))}));if(s.allok.ticket.trim())T.push('- All OK: '+one(s.allok.ticket));
 if(T.length)L.push('','Ticket lines:',...T);
 const W=s.watch.filter(w=>w.trim());if(W.length)L.push('','Watch out for:',...W.map(w=>'- '+one(w)));

 if(E.length){L.push('','## Replies');E.forEach(t=>L.push('','### Reply: '+t,String(s.emails[t]).replace(/^#{1,6}\s+/gm,'').trim()))}
 return L.join('\n').replace(/\n{3,}/g,'\n\n')+'\n'}

/* ---------- import (.md from P2A, Builder 3.x, dictation, or this Builder) ---------- */
function fromMd(txt){const R=[];const s=blank();s.checks=[];s.links=[];const lines=String(txt||'').replace(/\r/g,'').split('\n');
 const top=lines.findIndex(l=>/^##\s+(reply templates|replies|ticket templates)\b/i.test(l));const body=top>=0?lines.slice(0,top):lines,rep=top>=0?lines.slice(top):[];
 let sec='',steps=[],qs={},outs=[],dn={},tk=[],only=[],okOnly=[],after=[],def='',openp=[];
 const h1=body.find(l=>/^#\s+/.test(l));if(h1)s.title=h1.replace(/^#\s+(SOP for P2A:|P2A package:)?\s*/i,'').trim()||s.title;
 for(const raw of body){const l=raw.trim();let m;if(!l)continue;
  if(m=l.match(/^title\s*:\s*(.+)$/i)){s.title=m[1].trim();continue}
  if(m=l.match(/^tags\s*:\s*(.*)$/i)){s.tags=m[1].trim();continue}
  if(m=l.match(/^topic\s*:\s*(.*)$/i)){s.topic=m[1].trim();continue}
  if(m=l.match(/^confluence\s*:\s*(.*)$/i)){s.confluence=m[1].trim();continue}
  if(!sec&&(m=l.match(/^from\s*:\s*(.*?)(?:\s*\((.*)\))?$/i))){s.meta.name=m[1].trim();s.meta.role=(m[2]||'').trim();continue}
  if(!sec&&(m=l.match(/^notes\s*:\s*(.+)$/i))){s.meta.notes=m[1].trim();continue}
  if(m=l.match(/^when to use\s*:\s*(.*)$/i)){const p=m[1].split(/\|\s*applies to\s*:/i);s.when=p[0].trim();s.applies=(p[1]||'').trim();continue}
  if(m=l.match(/^(tool links|steps|questions|outcomes?|do now|ticket lines|watch out for|open points|clarifications)\s*:\s*$/i)){sec=m[1].toLowerCase();continue}
  if(/^#/.test(l)||/^(sent|made with)\s*:/i.test(l))continue;
  const it=l.replace(/^[-*•]\s*/,'');
  if(sec==='steps'&&(m=l.match(/^(\d+)[.)]\s*(.+)$/))){const p=m[2].split(/\s+[—–]\s+|\s+-\s+/);steps[+m[1]]={name:p[0].trim(),detail:p.slice(1).join(' — ').trim()};continue}
  if(sec==='tool links'&&(m=it.match(/^(.*?):\s*(https?:\/\/\S+)$/))){s.links.push({l:m[1].trim(),u:m[2]});continue}
  if(sec==='questions'&&(m=it.match(/^step\s+(\d+)\s*:\s*(.+)$/i))){qs[+m[1]]=m[2].trim();continue}
  if(sec.startsWith('outcome')){
   if(m=it.match(/^at step (\d+)\s*:\s*(.+)$/i)){const p=m[2].split(/\s*(?:->|→|=>)\s*/),a=(p.slice(1).join(' -> ')||'').split('|').map(x=>x.trim());let th='';const k=a.findIndex((x,q)=>q>0&&/^then\s*:/i.test(x));if(k>0){th=a[k].replace(/^then\s*:/i,'').trim();a.splice(k,1)}
    outs.push({n:+m[1],label:p[0].trim(),email:a[0]&&a[0]!=='-'?a[0]:'',words:a.slice(1).filter(Boolean).join(', '),then:th});continue}
   if(m=it.match(/^only when all ok\s*:\s*(.+)$/i)){okOnly=(m[1].match(/\d+/g)||[]).map(Number);continue}
   if(m=it.match(/^after step (\d+)\s*:\s*(.+)$/i)){after.push({n:+m[1],to:m[2].trim()});continue}
   if(m=it.match(/^(?:default|all ok)\s*(?:->|→|=>|:)\s*(.+)$/i)){def=m[1].trim();continue}
   if(m=it.match(/^only when (.+?)\s*:\s*(?:steps?\s*)?([\d,\s]+)$/i)){only.push({label:m[1].trim(),steps:(m[2].match(/\d+/g)||[]).map(Number)});continue}
  }
  if(sec==='do now'&&(m=it.match(/^(.+?)\s*:\s*(.+)$/))){dn[m[1].trim().toLowerCase()]=m[2].trim();continue}
  if(sec==='ticket lines'){if(m=it.match(/^all ok\s*:\s*(.+)$/i)){s.allok.ticket=m[1].trim();continue}if(m=it.match(/^at step (\d+)\s*:\s*(.+?)\s*:\s*(.+)$/i)){tk.push({n:+m[1],label:m[2].trim().toLowerCase(),t:m[3].trim()});continue}}
  if(sec==='watch out for'){s.watch.push(it);continue}
  if(sec==='open points'){openp.push(it);continue}
 }
 // steps that only run when all OK become the All OK action
 const okSet=new Set(okOnly);const map={};let k=0;
 steps.forEach((st,n)=>{if(!st)return;if(okSet.has(n)){s.allok.action=(s.allok.action?s.allok.action+'; ':'')+st.name+(st.detail?' — '+st.detail:'');return}
  map[n]=k++;s.checks.push(newCheck({name:st.name,detail:st.detail,question:qs[n]||'',answers:[okAns()]}))});
 if(okOnly.length&&!/Made with:\s*SOP Builder 4/i.test(txt))R.push('Step '+okOnly.join(', ')+' ran only when all OK, so it is now the All OK action.');
 s.allok.email=def&&def!=='-'?def:'';
 const thenOf=(t,from)=>{let m;if(!t)return{t:'next',v:''};if(/^(stop|end|stop here)$/i.test(t))return{t:'end',v:''};if(m=t.match(/^(?:go to\s+)?step\s+(\d+)$/i)){const j=map[+m[1]];if(j!=null&&j>from)return{t:'skip',v:s.checks[j].id};if(okSet.has(+m[1]))return{t:'next',v:''};return{t:'next',v:''}}if(m=t.match(/^sop\s*:?\s*(.+)$/i))return{t:'sop',v:m[1].trim()};return{t:'next',v:''}};
 outs.forEach(o=>{const i=map[o.n];if(i==null){R.push('Answer "'+o.label+'" was on step '+o.n+', which is not a check; it was left out.');return}
  const a=newAns({label:o.label,email:o.email,words:o.words,donow:dn[o.label.toLowerCase()]||''});if(/^other$/i.test(o.label))a.other=true;a.then=thenOf(o.then,i);s.checks[i].answers.push(a)});
 after.forEach(x=>{const i=map[x.n];if(i==null)return;const ok=s.checks[i].answers[0];ok.then=thenOf(x.to,i);R.push('"After step '+x.n+': '+x.to+'" is now the Then of check '+(i+1)+'’s OK answer.')});
 only.forEach(g=>R.push('"Only when '+g.label+': step '+g.steps.join(', ')+'" has no place in 4.0. Use a Skip on the other answers instead; check those steps.'));
 tk.forEach(t=>{const i=map[t.n];if(i==null)return;const a=s.checks[i].answers.find(x=>x.label.toLowerCase()===t.label||(x.ok&&t.label==='ok'));if(a)a.ticket=t.t});
 s.checks.forEach((c,i)=>{if(!c.answers.some(a=>a.other))c.answers.push(otherAns())});
 // replies
 let curT=null,buf=[];const flush=()=>{if(curT)s.emails[curT]=buf.join('\n').trim();curT=null;buf=[]};
 rep.forEach(l=>{let m;if(m=l.match(/^###\s+(?:reply|email)\s*:\s*(.+)$/i)){flush();curT=m[1].trim();return}if(/^###?\s/.test(l)){flush();return}if(curT&&!/^tags\s*:/i.test(l))buf.push(l)});flush();
 if(openp.length){s.meta.notes=(s.meta.notes?s.meta.notes+'\n':'')+'Open points: '+openp.join(' / ');R.push(openp.length+' open point(s) moved to Notes for the admin (Details).')}
 if(!s.checks.length){s.checks.push(newCheck());R.push('No numbered steps were found, so it starts with one empty check.')}
 s.status='Draft';return {s,R}}

/* ---------- actions ---------- */
function setPath(p,v,el){const s=sop(),c=s.checks[sel];const P=p.split('.');
 if(P[0]==='title'||P[0]==='tags'||P[0]==='when'||P[0]==='applies'||P[0]==='topic'||P[0]==='confluence'||P[0]==='status')s[P[0]]=v;
 else if(P[0]==='c')c[P[1]]=v;
 else if(P[0]==='ok')s.allok[P[1]]=v;
 else if(P[0]==='m')s.meta[P[1]]=v;
 else if(P[0]==='w')s.watch[+P[1]]=v;
 else if(P[0]==='l')s.links[+P[1]][P[2]]=v;
 else if(P[0]==='a'){const a=c.answers[+P[1]];if(P[2]==='then'){if(v==='end'||v==='next')a.then={t:v,v:''};else if(v==='sop')a.then={t:'sop',v:a.then.t==='sop'?a.then.v:''};else if(v.startsWith('skip:'))a.then={t:'skip',v:v.slice(5)};return 're'}
  if(P[2]==='sop'){a.then={t:'sop',v};return 'soft'}a[P[2]]=v}
 return 'soft'}
function softRefresh(){ // keep focus: only refresh the parts that show derived text
 const s=sop();if(tab==='build'){const box=document.querySelector('.checks');if(box){const cards=box.querySelectorAll('.ck');s.checks.forEach((c,i)=>{if(cards[i])cards[i].outerHTML=ckCard(c,i)})}
  const hb=document.querySelector('.build>div:last-child>.card.mt');if(hb){const t=document.createElement('div');t.innerHTML=buildHtml();const nh=t.querySelector('.build>div:last-child>.card.mt');if(nh)hb.replaceWith(nh)}
  const dl=$('#emlist');if(dl)dl.innerHTML=emailTitles().map(t=>`<option value="${esc(t)}">`).join('')}
 $('#nEm').textContent=usedEmails().size||'';$('#stat').textContent=s.status+' · '+s.checks.length+' checks'}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.p){const r=setPath(el.dataset.p,el.value,el);save();if(r==='re')render();else softRefresh()}
 else if(el.dataset.em!=null){sop().emails[el.dataset.em]=el.value;save()}});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.p){const r=setPath(el.dataset.p,el.value,el);save();render()}});
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-sel],[data-go]');if(!t)return;const s=sop();
 if(t.dataset.mv){const [i,d]=t.dataset.mv.split('|').map(Number),j=i+d;if(j<0||j>=s.checks.length)return;[s.checks[i],s.checks[j]]=[s.checks[j],s.checks[i]];sel=j;save();render();e.stopPropagation();return}
 if(t.dataset.sel!=null&&!e.target.closest('button')){sel=+t.dataset.sel;render();const ed=document.querySelector('.build>div:last-child');if(ed&&window.innerWidth<860)ed.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(t.dataset.go!=null){sel=+t.dataset.go;tab='build';store.set('tab',tab);render();return}
 if(t.dataset.t){tab=t.dataset.t;store.set('tab',tab);render();return}
 if(t.id==='addCk'){s.checks.push(newCheck());sel=s.checks.length-1;save();render();setTimeout(()=>{const x=document.querySelector('[data-p="c.name"]');if(x){x.focus();x.scrollIntoView({block:'center'})}},30);return}
 if(t.id==='addA'){const c=s.checks[sel],k=c.answers.findIndex(a=>a.other);c.answers.splice(k<0?c.answers.length:k,0,newAns());save();render();return}
 if(t.id==='addO'){s.checks[sel].answers.push(otherAns());save();render();return}
 if(t.dataset.dela!=null){s.checks[sel].answers.splice(+t.dataset.dela,1);save();render();toast('Answer removed. Undo brings it back.');return}
 if(t.id==='delCk'){if(!t.classList.contains('sure')){t.classList.add('sure');t.textContent='Sure? Remove check '+(sel+1);setTimeout(()=>{if(t.isConnected){t.classList.remove('sure');t.textContent='Remove check '+(sel+1)}},4000);return}
  const id=s.checks[sel].id;s.checks.splice(sel,1);s.checks.forEach(c=>c.answers.forEach(a=>{if(a.then.t==='skip'&&a.then.v===id)a.then={t:'next',v:''}}));if(!s.checks.length)s.checks.push(newCheck());sel=Math.max(0,sel-1);save();render();toast('Check removed. Undo brings it back.');return}
 if(t.id==='addW'){s.watch.push('');save();render();const w=document.querySelectorAll('[data-p^="w."]');if(w.length)w[w.length-1].focus();return}
 if(t.dataset.delw!=null){s.watch.splice(+t.dataset.delw,1);save();render();return}
 if(t.id==='addL'){s.links.push({l:'',u:''});save();render();return}
 if(t.dataset.dell!=null){s.links.splice(+t.dataset.dell,1);save();render();return}
 if(t.dataset.delem!=null){delete s.emails[t.dataset.delem];save();render();return}
 if(t.id==='dup'){const c=JSON.parse(JSON.stringify(s));c.id=uid();c.title=s.title+' (copy)';S.unshift(c);cur=c.id;sel=0;save(false);lastSnap=JSON.stringify(c);render();toast('Copy made');return}
 if(t.id==='delSop'){if(!t.classList.contains('sure')){t.classList.add('sure');t.textContent='Sure? Delete it';setTimeout(()=>{if(t.isConnected){t.classList.remove('sure');t.textContent='Delete this SOP'}},4000);return}
  S=S.filter(x=>x.id!==s.id);if(!S.length)S=[blank()];cur=S[0].id;sel=0;lastSnap=JSON.stringify(sop());store.set('sops',S);store.set('cur',cur);render();toast('Deleted. Undo brings it back.');undo.push({id:s.id,j:JSON.stringify(s),restore:true});return}
});
document.addEventListener('toggle',e=>{if(e.target.id==='wfold')store.set('wOpen',e.target.open)},true);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();doUndo()}if(e.key==='Escape')closeDlg();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.go!=null){e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#bUndo').onclick=()=>{const u=undo[undo.length-1];if(u&&u.restore&&!S.find(x=>x.id===u.id)){undo.pop();S.unshift(JSON.parse(u.j));cur=u.id;lastSnap=u.j;store.set('sops',S);render();toast('SOP restored');return}doUndo()};

/* ---------- dialogs ---------- */
let dlg=null;function closeDlg(){if(dlg){dlg.remove();dlg=null}}
function openDlg(html,onMount){closeDlg();dlg=document.createElement('div');dlg.className='scrim';dlg.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;dlg.addEventListener('click',e=>{if(e.target===dlg||e.target.closest('[data-close]'))closeDlg()});document.body.appendChild(dlg);onMount&&onMount(dlg)}
function sopsDlg(q=''){const L=S.filter(x=>x.title.toLowerCase().includes(q.toLowerCase()));openDlg(`<h2>Your SOPs <button class="btn" data-close>Close</button></h2>
 <input class="in" id="sq" placeholder="Search SOPs" value="${esc(q)}" aria-label="Search SOPs">
 <div class="list">${L.map(x=>`<div class="li ${x.id===cur?'on':''}" data-open="${x.id}"><span class="t">${esc(x.title)}</span><span class="s">${x.checks.length} checks · ${esc(x.status)}</span></div>`).join('')||'<div class="muted">No SOP matches.</div>'}</div>
 <div class="acts"><button class="btn pri" id="nNew">+ New SOP</button><button class="btn" id="nImp">Import a .md file</button><button class="btn" id="nEx">Add the example</button></div>
 <div class="muted mt">Import reads P2A SOP files, older Builder files and dictation files, and turns them into checks and answers.</div>`,d=>{
 const sq=d.querySelector('#sq');sq.focus();sq.setSelectionRange(q.length,q.length);sq.oninput=()=>sopsDlg(sq.value);
 d.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{cur=x.dataset.open;sel=0;lastSnap=JSON.stringify(sop());store.set('cur',cur);closeDlg();render()});
 d.querySelector('#nNew').onclick=()=>{const b=blank();S.unshift(b);cur=b.id;sel=0;lastSnap=JSON.stringify(b);store.set('sops',S);store.set('cur',cur);tab='build';closeDlg();render();setTimeout(()=>{$('#ttl').focus();$('#ttl').select()},30)};
 d.querySelector('#nImp').onclick=()=>$('#file').click();
 d.querySelector('#nEx').onclick=()=>{const b=example();S.unshift(b);cur=b.id;sel=0;lastSnap=JSON.stringify(b);store.set('sops',S);store.set('cur',cur);closeDlg();render()}})}
$('#bSops').onclick=()=>sopsDlg();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let txt='';try{txt=await f.text()}catch(x){toast('Could not read that file');return}
 const {s,R}=fromMd(txt);S.unshift(s);cur=s.id;sel=0;lastSnap=JSON.stringify(s);store.set('sops',S);store.set('cur',cur);tab='build';render();
 openDlg(`<h2>Imported: ${esc(s.title)} <button class="btn" data-close>OK</button></h2><div class="muted">${s.checks.length} checks, ${s.checks.reduce((n,c)=>n+c.answers.filter(a=>!a.ok&&!a.other).length,0)} problem answers, ${Object.keys(s.emails).length} emails.</div>
 ${R.length?`<h3 class="mt">What changed on the way in</h3><ul class="report">${R.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:'<div class="good mt">Nothing needed changing.</div>'}
 <div class="muted mt">Each check got an OK and an Other answer. Fill in the ticket lines, then check the hints under the answer table.</div>`)};
function dlDlg(){const s=sop(),H=hints(),md=toMd(s),fn='SOP-'+(s.title.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'sop')+'.md';
 openDlg(`<h2>Download SOP file <button class="btn" data-close>Close</button></h2>
 <div class="muted">A Markdown file in the P2A format. An admin imports it in P2A (Architecture › SOPs › Import), and it lands In review.</div>
 ${H.length?`<div class="hint">⚑ <span><b>${H.length} thing${H.length>1?'s':''} to look at first.</b> You can still download. ${esc(H[0][0]+' '+H[0][1])}</span></div>`:'<div class="good mt">✓ No open checks.</div>'}
 <div class="row2 mt"><div><label class="f">Your name</label><input class="in" data-p="m.name" value="${esc(s.meta.name)}"></div><div><label class="f">Your role</label><input class="in" data-p="m.role" value="${esc(s.meta.role)}"></div></div>
 <details class="fold mt"><summary>See the file</summary><pre class="out" id="mdout">${esc(md)}</pre></details>
 <div class="acts"><button class="btn pri" id="dDl">Download ${esc(fn)}</button><button class="btn" id="dCp">Copy as text</button></div>`,d=>{
 d.querySelector('#dDl').onclick=async()=>{const txt=toMd(sop());let dd=null;try{dd=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(x){dd=null}
  if(dd){try{const r=await dd.save({filename:fn,data:txt});if(r&&r.status==='saved')toast('Saved '+fn)}catch(x){if(x&&x.code!=='cancelled'&&x.code!=='declined')toast('Could not save. Use Copy as text.')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/markdown'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Downloading '+fn)}catch(x){toast('Download is not available here. Use Copy as text.')}};
 d.querySelector('#dCp').onclick=async()=>{try{await navigator.clipboard.writeText(toMd(sop()));toast('Copied. Paste it into a .md file or straight into P2A.')}catch(x){const p=d.querySelector('#mdout');p.closest('details').open=true;const r=document.createRange();r.selectNodeContents(p);const g=getSelection();g.removeAllRanges();g.addRange(r);toast('Text selected: press Ctrl+C')}};
 d.querySelectorAll('[data-p]').forEach(i=>i.addEventListener('input',()=>{d.querySelector('#mdout').textContent=toMd(sop())}))})}
$('#bDl').onclick=dlDlg;
$('#bHow').onclick=()=>openDlg(`<h2>How to build an SOP <button class="btn" data-close>Close</button></h2><div class="how">
 <p class="muted">An SOP is a short list of checks. The agent works each one: check, find the problem, act.</p>
 <ol><li><b>When to use.</b> Name the member’s issue in one line.</li>
 <li><b>Checks.</b> Add 5 to 7. Each is one thing the agent looks at, with the question they answer.</li>
 <li><b>Answers.</b> Every check has an OK answer and an Other. Add the 2 to 4 problems the agent can find. For each one: the words the member uses, what to do now, the email, the ticket line, and what happens next.</li>
 <li><b>Then.</b> The only way to branch: go to the next check, skip ahead, end the case, or open another SOP.</li>
 <li><b>All OK.</b> What the agent does, sends and writes when nothing is wrong.</li>
 <li><b>Emails.</b> Write each email once; any answer can use it by title. XXX is the first name.</li>
 <li><b>Watch out for.</b> Only the 2 to 4 mistakes that really happen.</li>
 <li><b>Download</b> the file and send it to an admin to import into P2A.</li></ol>
 <p class="muted">The Diagram draws itself from the checks. Undo (Ctrl+Z) takes back the last change. Everything is saved in this browser only.</p></div>`);
$('#bTheme').onclick=()=>{const r=document.documentElement,now=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=now==='dark'?'light':'dark';r.dataset.theme=n;store.set('theme',n)};
{const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th}
let tT=null;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;clearTimeout(tT);tT=setTimeout(()=>t.remove(),2600)}

window.__sb4={toMd,fromMd,sop:()=>sop(),hints,S:()=>S};
render();
})();
