(function(){
'use strict';
const KEY='sopBuilder.v1',UIKEY='sopBuilder.ui.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const EXAMPLE=`# SOP for P2A: Parking permit request (example)

From: Example
Notes for import: This is the example that comes with the builder.

## SOP

Title: Parking permit request (example)
Tags: Permits, parking

Steps:
1. Find the member in back office — Search by name, then narrow by email.
2. Check the account is active — Suspended or closed accounts cannot get a permit.
3. Check the vehicle details — Plate, make and colour are filled in and match the photo.
4. Check the permit is not already issued — One permit per vehicle at a time.
5. Issue the permit, or leave on hold — Hold: leave the request open and note what we are waiting for.

Outcomes:
- At step 1: No account found -> ACCOUNT NOT FOUND
- At step 2: Account suspended -> ACCOUNT SUSPENDED | suspended, closed account
- At step 3: Plate missing -> PLATE NEEDED | no plate, plate not entered
- At step 3: Photo does not match -> PHOTO DOES NOT MATCH
- At step 4: Permit already issued -> PERMIT ALREADY ISSUED | already have a permit
- Only when all OK: step 5

Do now:
- Account suspended: Do not issue a permit. Note why in the profile.
- Permit already issued: Do not issue a second permit.

Watch out for:
- Never issue a permit for a plate that belongs to another member.
- A temporary paper plate is not a valid plate.

## Replies

### Reply: PLATE NEEDED
Hi XXX,

Thanks for your permit request. We still need the licence plate for your vehicle. Please reply with the plate number and we will issue your permit right away.

## Tickets

### Ticket: PLATE NEEDED
Permit request missing the plate number. Asked the member to send it. Request left open.
`;

 if(m=t.match(/^Notes(?: for (?:import|Grigor))?:\s*(.+)$/m))o.notes=m[1].trim();
 if(m=t.match(/^Title:\s*(.+)$/m))o.title=m[1].trim();else if(h1)o.title=h1[1].replace(/^SOP for P2A:\s*/i,'').replace(/[*_`]/g,'').trim();
 if(m=t.match(/^Tags?:\s*(.+)$/m)){const a=m[1].split(/[,;]/).map(x=>x.trim()).filter(Boolean);o.topic=a[0]||'';o.tags=a.slice(1).join(', ')}
 let sec='',cur=null;
 t.split('\n').forEach(line=>{
  const hm=line.match(/^(#{2,3})\s+(.+?)\s*#*$/);
  if(hm){const x=hm[2].replace(/[*_`]/g,'').trim();
   if(hm[1]==='##'){sec=/^repl/i.test(x)?'replies':/^ticket/i.test(x)?'tickets':'';cur=null;return}
   if(sec==='replies'||sec==='tickets'){cur={t:x.replace(/^(reply|ticket)\s*[:\-–—]\s*/i,'').trim(),L:[]};(sec==='replies'?mail:tick)[low(cur.t)]=cur;return}}
  if(sec==='replies'||sec==='tickets'){if(cur)cur.L.push(line);return}
  const hh=line.match(/^\s*(Steps|Outcomes|Do now|Watch out for|Tool links?|Tools and links|Rules|Escalate when|Sources)\s*:\s*$/i);if(hh){sec=hh[1].toLowerCase();return}
  const x=line.trim();if(!x)return;
  if(sec==='steps'){const s=x.match(/^(\d+)[.)]\s*(.+?)(?:\s+[—–]\s+(.*))?$/);if(s)o.steps.push(mkStep(s[2].trim(),(s[3]||'').trim()))}
  else if(sec==='outcomes'){let r=x.match(/^[-*•]?\s*At step (\d+)\s*:\s*(.+?)\s*(?:->|→|=>)\s*(.*)$/i);
   if(r){const p=r[3].split('|');outs.push({n:+r[1],label:r[2].trim(),tpl:(p[0]||'').trim(),words:p.slice(1).join('|').trim()});return}
   if(r=x.match(/^[-*•]?\s*(?:All OK|Default)\s*(?:->|→|=>|:)\s*(.+)$/i)){okTpl=r[1].trim();return}
   if(r=x.match(/^[-*•]?\s*Only when all OK\s*:\s*step\s*(\d+)/i))only=+r[1]}
  else if(sec==='do now'){const r=x.match(/^[-*•]?\s*(.+?):\s+(.+)$/);if(r)dn[low(r[1])]=r[2].trim()}
  else if(sec==='watch out for'){o.watch.push(x.replace(/^[-*•]\s*/,''))}
  else if(/^tool|^tools/.test(sec)){const u=x.match(/https?:\/\/[^\s)>\]]+/);let lab=x.replace(/^[-*•]\s*/,'');if(u)lab=lab.slice(0,lab.indexOf(u[0]));lab=lab.replace(/[\s:|–—(\[-]+$/,'').trim();
   let st=0;const sm=lab.match(/\s*\((?:step|at step)\s*(\d+)\)\s*$/i);if(sm){st=+sm[1];lab=lab.slice(0,sm.index).trim()}
   const sm2=x.match(/\|\s*step\s*(\d+)\s*$/i);if(sm2)st=+sm2[1];
   if(u&&/^confluence( page)?$/i.test(lab)&&!o.confluence){o.confluence=u[0];return}
   lks.push({id:uid(),name:lab||(u?u[0]:''),url:u?u[0]:'',st})}
 });
 const body=c=>c?c.L.join('\n').replace(/^\n+|\s+$/g,''):'';
 outs.forEach(u=>{const s=o.steps[u.n-1];if(!s)return;const kind=u.tpl==='-'?'path':u.tpl?'email':'none';
  s.outs.push(mkOut({label:u.label,kind,tpl:kind==='email'?u.tpl:'',words:u.words,doNow:dn[low(u.label)]||'',text:kind==='email'?body(mail[low(u.tpl)]):'',ticket:kind==='email'?body(tick[low(u.tpl)]):''}))});
 o.links=lks.map(k=>({id:k.id,name:k.name,url:k.url,step:k.st&&o.steps[k.st-1]?o.steps[k.st-1].id:''}));
 if(okTpl&&okTpl!=='-'){o.ok.tpl=okTpl;o.ok.text=body(mail[low(okTpl)]);o.ok.ticket=body(tick[low(okTpl)])}

const one=s=>String(s||'').replace(/\s*\n+\s*/g,' ').trim();

function safeBody(s){return String(s||'').replace(/\r\n?/g,'\n').split('\n').map(l=>l.replace(/^\s*#+\s*/,'').replace(/^\s*>\s?/,'').replace(/^(\s*)tip\s*:/i,'$1Tip -')).join('\n').replace(/^\n+|\s+$/g,'')}
function exportText(S){
 const idx=id=>S.steps.findIndex(s=>s.id===id)+1,title=cl(S.title)||'Untitled SOP',D=new Date().toISOString().slice(0,10);
 let t='# SOP for P2A: '+title+'\n\nFrom: '+(cl(S.author)||'not given')+(one(S.role)?' ('+one(S.role).replace(/[()]/g,'')+')':'')+'\nSent: '+D+'\nMade with: SOP Builder 1.0\n';
 if(one(S.notes))t+='Notes for import: '+one(S.notes)+'\n';
 t+='\n## SOP\n\nTitle: '+title+'\n';
 const tags=[S.topic,...String(S.tags||'').split(',')].map(x=>cl(x).replace(/,/g,'')).filter(Boolean);if(tags.length)t+='Tags: '+tags.join(', ')+'\n';
 const L=[];if(isUrl(S.confluence))L.push('- Confluence page: '+S.confluence.trim());
 S.links.forEach(k=>{if(!isUrl(k.url))return;const i=k.step?idx(k.step):0;L.push('- '+(cl(k.name).replace(/:/g,' ')||'Link')+(i?' (step '+i+')':'')+': '+k.url.trim())});
 if(L.length)t+='Tool links:\n'+L.join('\n')+'\n';
 t+='\nSteps:\n'+S.steps.map((s,i)=>(i+1)+'. '+(cl(s.name).replace(/\s+[—–]\s+/g,', ')||'Step '+(i+1))+(one(s.detail)?' — '+one(s.detail):'')).join('\n')+'\n';
 const O=[];S.steps.forEach((s,i)=>s.outs.forEach(o=>{if(!cl(o.label))return;const tp=o.kind==='path'?'-':o.kind==='email'?cl(o.tpl):'';O.push('- At step '+(i+1)+': '+cl(o.label).replace(/:/g,' -')+' -> '+tp+(cl(o.words)?' | '+cl(o.words):''))}));
 if(cl(S.ok.tpl))O.push('- All OK -> '+cl(S.ok.tpl));
 if(S.ok.only&&idx(S.ok.only))O.push('- Only when all OK: step '+idx(S.ok.only));
 if(O.length)t+='\nOutcomes:\n'+O.join('\n')+'\n';
 const DN=[];S.steps.forEach(s=>s.outs.forEach(o=>{if(cl(o.label)&&one(o.doNow))DN.push('- '+cl(o.label).replace(/:/g,' -')+': '+one(o.doNow))}));
 if(DN.length)t+='\nDo now:\n'+DN.join('\n')+'\n';
 const W=S.watch.map(one).filter(Boolean);if(W.length)t+='\nWatch out for:\n'+W.map(w=>'- '+w).join('\n')+'\n';
 const R=new Map(),T=new Map();
 const take=(tp,text,ticket)=>{const k=low(cl(tp));if(!k)return;if(safeBody(text)&&!R.has(k))R.set(k,[cl(tp),safeBody(text)]);if(safeBody(ticket)&&!T.has(k))T.set(k,[cl(tp),safeBody(ticket)])};
 S.steps.forEach(s=>s.outs.forEach(o=>{if(o.kind==='email')take(o.tpl,o.text,o.ticket)}));take(S.ok.tpl,S.ok.text,S.ok.ticket);
 if(R.size)t+='\n## Replies\n'+[...R.values()].map(([n,b])=>'\n### Reply: '+n+'\n'+b+'\n').join('');
 if(T.size)t+='\n## Tickets\n'+[...T.values()].map(([n,b])=>'\n### Ticket: '+n+'\n'+b+'\n').join('');
 return t}

 case 'wadd':{const v=$('#wnew').value.trim();if(!v){$('#wnew').focus();return}S.watch.push(v);ui.secs.watch=true;ui.focus='#wnew';ch();break}
 case 'wrm':S.watch.splice(+b.dataset.i,1);ch();break;
 case 'ladd':{const n={id:uid(),name:'',url:'',step:s?s.id:''};S.links.push(n);if(!s)ui.secs.links=true;else ui.open.add(s.id);ui.focus='[data-f="l.name"][data-l="'+n.id+'"]';ch();break}
 case 'lrm':S.links=S.links.filter(k=>k.id!==b.dataset.l);ch();break;
 case 'send':openSend();break;
 case 'dl':download();break;
 case 'close':$('#ov').hidden=true;break;
 case 'copy':copy(exportText(S),$('#sendTxt'),'Copied. Paste it into a new file saved as .md.');break;
  case 'go':{$('#ov').hidden=true;ui.tab=b.dataset.g==='details'?'details':'build';saveUi();if(b.dataset.s){ui.open.add(b.dataset.s);if(b.dataset.o)ui.sel={s:b.dataset.s,o:b.dataset.o}}
   render(false);const el=b.dataset.o?document.querySelector('[data-o="'+b.dataset.o+'"]'):b.dataset.s?document.getElementById('n-'+b.dataset.s)||document.querySelector('[data-ls="'+b.dataset.s+'"]'):(ui.tab==='details'?$('#d-title'):null);
   if(el){el.scrollIntoView({block:'center'});if(el.focus)el.focus({preventScroll:true})}break}
 case 'imp':{const v=$('#impTxt').value;const n=parseAny(v);if(!n.steps.length){$('#impMsg').textContent='No steps found. The text needs a "Steps:" list with numbered steps.';return}newSop(n);toast('Opened "'+(n.title||'Untitled SOP')+'" with '+n.steps.length+' steps');break}
 case 'delsop':if(!arm('sop'))return;delete DB.sops[S.id];if(!Object.keys(DB.sops).length){const e2=fresh();DB.cur=e2.id}switchTo(Object.values(DB.sops).sort((x,y)=>y.updated-x.updated)[0].id);toast('SOP removed');break;
 }});
document.addEventListener('input',e=>{const el=e.target,f=el.dataset.f;if(!f)return;const v=el.value;
 const s=el.dataset.s?findStep(el.dataset.s):null,o=s&&el.dataset.o?s.outs.find(x=>x.id===el.dataset.o):null;
 const txt=(sel,t)=>document.querySelectorAll(sel).forEach(n=>n.textContent=t);
 const cn=()=>{const c=cons(o);document.querySelectorAll('[data-oc="'+o.id+'"]').forEach(n=>{n.textContent=c.t;n.className=c.w?'warn':''})};
 if(S.example&&f!=='S.notes')S.example=false;
 switch(f){
 case 's.name':s.name=v;txt('[data-sn="'+s.id+'"]',v||'New step');break;
 case 's.detail':s.detail=v;break;
 case 'o.label':o.label=v;txt('[data-ol="'+o.id+'"]',v||'New outcome');break;
 case 'o.tpl':{o.tpl=v;const sh=users(v,o),box=$('#oe-share');if(box){box.hidden=!sh.length;box.textContent='Also used by: '+sh.join(', ')+'. Changing the text changes it for all of them.'}cn();break}
 case 'o.text':case 'o.ticket':{const k=f.slice(2);o[k]=v;const key=low(o.tpl);if(key){S.steps.forEach(x=>x.outs.forEach(y=>{if(y!==o&&y.kind==='email'&&low(y.tpl)===key)y[k]=v}));if(low(S.ok.tpl)===key)S.ok[k]=v}cn();break}
 case 'o.doNow':case 'o.words':o[f.slice(2)]=v;cn();break;
 case 'ok.tpl':case 'ok.text':case 'ok.ticket':{const k=f.slice(3);S.ok[k]=v;if(k!=='tpl'){const key=low(S.ok.tpl);if(key)S.steps.forEach(x=>x.outs.forEach(y=>{if(y.kind==='email'&&low(y.tpl)===key)y[k]=v}))}break}
 case 'w':S.watch[+el.dataset.i]=v;break;
 case 'l.name':case 'l.url':{const k=S.links.find(x=>x.id===el.dataset.l);if(k)k[f.slice(2)]=v;break}
 default:if(f.startsWith('S.')){S[f.slice(2)]=v;if(f==='S.title')renderTop()}}
 save();if(ui.tab==='build'&&ui.view==='web')requestAnimationFrame(lines)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='sopPick'){switchTo(el.value);return}
 if(el.id==='impFile'){const file=el.files[0];el.value='';if(!file)return;const r=new FileReader();r.onload=()=>{$('#impTxt').value=String(r.result||'');$('#impMsg').textContent='Loaded '+file.name+'. Press "Open as a new SOP".'};r.onerror=()=>{$('#impMsg').textContent='Could not read that file. Copy its text and paste it here instead.'};r.readAsText(file);return}
 const f=el.dataset.f;if(!f)return;
 if(f==='l.step'){const k=S.links.find(x=>x.id===el.dataset.l);if(k){k.step=el.value;if(k.step)ui.open.add(k.step)}ch();return}
 if(f==='ok.only'){S.ok.only=el.value;ch();return}
 if(f==='o.tpl'){const s=findStep(el.dataset.s),o=s&&s.outs.find(x=>x.id===el.dataset.o);if(o&&!o.text.trim()){let src=null;S.steps.forEach(x=>x.outs.forEach(y=>{if(!src&&y!==o&&y.kind==='email'&&low(y.tpl)===low(o.tpl)&&(y.text||y.ticket))src=y}));if(src){o.text=src.text;o.ticket=src.ticket;ch()}}}});
document.addEventListener('toggle',e=>{const d=e.target;if(!(d instanceof HTMLDetailsElement))return;
 if(d.dataset.sec){ui.secs[d.dataset.sec]=d.open;saveUi()}
 if(d.dataset.ls){const id=d.dataset.ls,was=ui.open.has(id);if(d.open&&!was){ui.open.add(id);render()}else if(!d.open&&was){ui.open.delete(id);if(ui.sel&&ui.sel.s===id)ui.sel=null;render()}}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#ov').hidden){$('#ov').hidden=true;return}if(ui.sel){ui.sel=null;render()}}
 if(e.key==='Enter'&&e.target.id==='wnew'){e.preventDefault();document.querySelector('[data-a="wadd"]').click()}});

window.__sopb={parseAny,exportText,get S(){return S},get DB(){return DB}};
render(false);
})();
</script>
