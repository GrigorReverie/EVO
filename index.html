<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVO</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#1f2933;--mut:#5f6b76;--line:#dde3e8;--cyan:#5BC2E7;--cyan-dk:#2f8fb5;--nav:#0d1b26}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#16212b;--ink:#e6edf3;--mut:#9aa7b2;--line:#26333f;--cyan-dk:#7fd0ee}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--nav);color:#fff;padding:18px 16px}header h1{margin:0;font-size:20px;letter-spacing:.08em}header p{margin:4px 0 0;color:#b9c6d1;font-size:14px}
main{max-width:860px;margin:0 auto;padding:24px 16px;display:grid;gap:14px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:12px;padding:16px 18px}

</style></head><body>
<header><h1>◆ EVO</h1><p>Tools for the Evo member support team</p></header>
<main>
